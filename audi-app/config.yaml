# =============================================================================
# AUDI — Type A Configuration
# =============================================================================

# --- Audio Recording ---
audio:
  device: "auto"                    # ALSA device name — 'auto' discovers first USB device, or use 'hw:2,0'
  sample_rate: 16000             # Hz — 16KHz recommended for detection quality
  bit_depth: 16                  # 16-bit PCM
  channels: 1                    # Mono — sufficient for detection
  segment_duration: 300          # Seconds (5 minutes) per recording segment
  ring_buffer_seconds: 120       # In-memory buffer: 60s pre-alarm + 60s post-alarm
  format: "wav"                  # Raw capture format (wav before compression)
  device_retry_min: 2            # Min seconds between audio device retries
  device_retry_max: 60           # Max (doubles on each failure)

# --- Storage Ring Buffer ---
storage:
  max_size_gb: 32                # Max storage to use for audio (main recordings)
  compress: true                 # Compress old segments to FLAC
  data_dir: "./data/recordings"   # Where audio lives (bind mount for persistence)
  min_free_gb: 1                 # Trigger cleanup when disk free drops below this
  cleanup_watermark_gb: 2        # Free up until this much is available
  alerts_dir: "./data/alerts"     # Alarm-triggered snapshots (not auto-evicted)
  max_alerts_gb: 2               # Separate cap for alert snapshots

# --- Detection Engine (TFLite float32) ---
detection:
  model_type: "tflite"
  model_path: "./models/model_combined_dymn10_blue_red.tflite"

  # Model config (must match the exported TFLite model)
  model_sample_rate: 16000       # Hz — model expects 16kHz audio
  n_mels: 128                    # Mel filterbank bins
  n_fft: 1024                    # FFT window size
  hop_length: 160                # Hop length in samples
  window_samples: 81920          # 16000 Hz × 5.12s → 512 frames (librosa center=True)
  stride: 0.0625                 # Sliding window stride (0.0625 = 6.25% step size)

  # Debug mode — logs per-window timing at DEBUG level
  debug: true

  # Mel normalization (set if model was trained with specific mean/std)
  mel_mean: 10.430418
  mel_std: 5.288271

  # TFLite runtime
  num_threads: 2                 # CPU threads for inference (Pi: 2-4)

  # Inference timing
  inference_interval: 0.320      # Seconds between inference runs

  # Threshold profiles. Values are loaded from threshold_profiles_file so field
  # tuning can happen without code changes.
  active_threshold_profile: "balanced"
  threshold_profiles_file: "./threshold_profiles.yaml"

  # Combined model output:
  #   logit 0: drone detector
  #   logit 1: blue drone
  #   logit 2: red drone (positive class for color)
  confidence_threshold_high: 0.6703   # Triggers alarm
  confidence_threshold_low: 0.6703    # Minimum raw drone score for color typing
  blue_red_threshold: 0.50            # Raw RED/BLUE split before hysteresis
  blue_red_min_detection_score: 0.6703 # Only type windows that look like drones
  red_alert_threshold: 0.37           # RED alert if red confidence is above this
  blue_alert_threshold: 0.50          # BLUE alert if blue confidence is above this
  blue_to_red_threshold: 0.37         # Lower threshold to enter RED state
  red_to_blue_threshold: 0.56         # Harder threshold to leave RED state
  color_hysteresis_window: 8
  color_hysteresis_ratio: 0.6
  alert_on_red: true
  alert_on_blue: false
  alert_on_unknown: false
  save_color_trace: true
  hysteresis_window: 8               # Hysteresis window size
  hysteresis_ratio: 0.6              # Hysteresis ratio
  hysteresis_margin: 0.05            # Hysteresis margin
  alarm_cooldown_s: 120               # Exclusion period after alarm (0 = no cooldown)

  labels: ["drone"]                  # Detection class label
  alert_history_file: "./data/alerts/alert_history.json"

# --- GPIO Alarm System ---
gpio:
  enabled: true
  alert_pin: 22                  # Alert output — e.g. buzzer/relay
  strobe_pin: 24                 # Strobe/visual indicator
  reset_pin: 23                  # Physical reset button input (pull-up)
  record_led_pin: 27             # Recording indicator LED (on when recording)
  record_button_pin: 17          # Toggle recording on/off (pull-up input)
  pause_button_pin: 18           # Pause recording for 5 minutes (pull-up input)
  alert_duration_ms: 5000       # How long to hold alert active
  pulse_interval_ms: 500         # Blink/pulse interval during alert
  red_buzzer_on_ms: 120          # Fast urgent pattern for RED ALERT
  red_buzzer_off_ms: 80
  blue_buzzer_on_ms: 420         # Slower pattern for BLUE ALERT
  blue_buzzer_off_ms: 280
  unknown_buzzer_on_ms: 250
  unknown_buzzer_off_ms: 250

# --- Web UI ---
web:
  host: "0.0.0.0"
  port: 8080

# --- Logging ---
logging:
  level: "DEBUG"                  # DEBUG, INFO, WARNING, ERROR
  file: "./audio-guard.log"
  max_size_mb: 500
  backup_count: 3
