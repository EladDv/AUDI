# AUDI threshold profiles.
#
# Detector thresholds are calibrated for the maintained MN10 mined-hard-negative
# detector. Color is typed only after positive detection:
# RED if red confidence >= red_color_threshold,
# BLUE if blue confidence >= blue_color_threshold,
# otherwise UNKNOWN.
threshold_profiles:
  mn10_p75:
    confidence_threshold_high: 0.5785
    red_color_threshold: 0.217
    blue_color_threshold: 0.330
  mn10_p90:
    confidence_threshold_high: 0.6895
    red_color_threshold: 0.330
    blue_color_threshold: 0.400
  mn10_p99:
    confidence_threshold_high: 0.7165
    red_color_threshold: 0.400
    blue_color_threshold: 0.500
