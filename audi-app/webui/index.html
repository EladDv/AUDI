<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,maximum-scale=1.0">
  <title>AUDI — Type A</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f4f6f8;
      color: #1d2530;
      padding: 10px;
      max-width: 800px;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    /* --- Header --- */
    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1 .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot.green {
      background: #0a7;
      box-shadow: 0 0 8px #0a7;
    }

    .dot.red {
      background: #e44;
      box-shadow: 0 0 8px #e44;
    }

    .dot.yellow {
      background: #da0;
      box-shadow: 0 0 8px #da0;
    }

    .dot.blue {
      background: #08f;
      box-shadow: 0 0 8px #08f;
    }

    .dot.gray {
      background: #555;
    }

    /* --- Status Grid --- */
    .status-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .status-card {
      background: #1a1a2e;
      border-radius: 10px;
      padding: 10px;
    }

    .status-card .label {
      font-size: 0.6rem;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .status-card .value {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
    }

    .value.green {
      color: #0a7;
    }

    .value.red {
      color: #e44;
    }

    .value.amber {
      color: #da0;
    }

    .value.white {
      color: #eee;
    }

    body:not(.dark-mode) .value.white {
      color: #111827;
    }

    body.dark-mode .value.white {
      color: #f5f7fa;
    }

    .value.blue {
      color: #08f;
    }

    /* --- VU Meter --- */
    .vu-section {
      margin-bottom: 10px;
    }

    .vu-label {
      font-size: 0.65rem;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .vu-track {
      width: 100%;
      height: 18px;
      background: #111;
      border-radius: 9px;
      overflow: hidden;
      border: 1px solid #222;
      position: relative;
    }

    .vu-fill {
      height: 100%;
      border-radius: 9px;
      transition: width 0.1s ease;
      background: linear-gradient(90deg, #0a7, #da0 60%, #e44 85%);
    }

    .vu-db {
      position: absolute;
      right: 8px;
      top: 1px;
      font-size: 0.7rem;
      color: #888;
      font-weight: 600;
    }

    .vu-label-inline {
      position: absolute;
      left: 8px;
      top: 1px;
      font-size: 0.65rem;
      color: #888;
    }

    /* --- State Card (YES / BLUE / NO) --- */
    .state-card {
      margin-bottom: 10px;
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .state-card.state-no {
      background: #111122;
      border: 2px solid #1a1a3e;
    }

    .state-card.state-yes {
      background: #2a0808;
      border: 2px solid #e33;
      animation: pulse-bg 1.5s ease-in-out infinite;
    }

    .state-card.state-red-alert {
      background: #2a0808;
      border: 2px solid #e33;
      animation: pulse-bg 1.5s ease-in-out infinite;
    }

    .state-card.state-blue-alert {
      background: #071d33;
      border: 2px solid #08f;
    }

    .state-card.state-unknown-alert {
      background: #2a2108;
      border: 2px solid #da0;
    }

    @keyframes pulse-bg {

      0%,
      100% {
        background: #2a0808;
      }

      50% {
        background: #3a0a0a;
      }
    }

    .state-label {
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .state-label.no {
      color: #555;
    }

    .state-label.yes {
      color: #f44;
    }

    .state-label.red-alert {
      color: #f44;
    }

    .state-label.blue-alert {
      color: #4af;
    }

    .state-label.unknown-alert {
      color: #da0;
    }

    .state-sub {
      font-size: 0.8rem;
      color: #888;
    }

    .state-confidences {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 6px;
    }

    .state-conf-item {
      text-align: center;
    }

    .state-conf-item .val {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .state-conf-item .lbl {
      font-size: 0.6rem;
      color: #666;
      text-transform: uppercase;
    }

    .threshold-info {
      font-size: 0.6rem;
      color: #444;
      margin-top: 4px;
    }

    /* --- Action Buttons --- */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .btn {
      flex: 1;
      padding: 22px 10px;
      border: none;
      border-radius: 14px;
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.1s, opacity 0.15s;
      letter-spacing: 0.5px;
    }

    .btn:active {
      transform: scale(0.93);
      opacity: 0.8;
    }

    .btn-start {
      background: linear-gradient(135deg, #0a7, #086);
      box-shadow: 0 4px 12px rgba(0, 170, 119, 0.3);
    }

    .btn-stop {
      background: linear-gradient(135deg, #d33, #a22);
      box-shadow: 0 4px 12px rgba(204, 51, 51, 0.3);
    }

    .btn-silence {
      background: linear-gradient(135deg, #f80, #d60);
      box-shadow: 0 4px 16px rgba(255, 136, 0, 0.5);
      color: #fff;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    }

    .btn-pause {
      background: linear-gradient(135deg, #08f, #06b);
      box-shadow: 0 4px 16px rgba(0, 136, 255, 0.4);
    }

    .btn-close {
      background: linear-gradient(135deg, #596575, #374151);
      box-shadow: 0 4px 16px rgba(55, 65, 81, 0.25);
    }

    .btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .btn.hidden {
      display: none;
    }

    /* Primary row (Start/Stop) = biggest */
    .btn-group-primary .btn {
      padding: 28px 10px;
      font-size: 1.5rem;
      border-radius: 16px;
    }

    /* Secondary row (Silence/Pause) = smaller */
    .btn-group-secondary .btn {
      padding: 16px 10px;
      font-size: 1rem;
      border-radius: 12px;
    }

    /* Debug row (Test Alert) = subtle */
    .btn-group-debug {
      justify-content: center;
      margin-bottom: 6px;
    }

    .btn-group-debug .btn {
      padding: 8px 24px;
      font-size: 0.75rem;
      border-radius: 20px;
      width: auto;
      flex: 0 0 auto;
    }

    .btn-debug {
      background: #222;
      color: #666;
      border: 1px solid #333;
      box-shadow: none;
    }

    .btn-debug:active {
      background: #333;
    }

    /* --- Alert History --- */
    .history {
      margin-bottom: 10px;
    }

    .history h2 {
      font-size: 0.8rem;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .history-scroll {
      max-height: 200px;
      overflow-y: auto;
      border-radius: 8px;
      background: #0e0e16;
      padding: 4px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: #12121e;
      border-radius: 6px;
      margin: 3px 0;
      font-size: 0.8rem;
    }

    .history-item .time {
      color: #666;
      font-size: 0.7rem;
    }

    .history-item .event {
      font-weight: 600;
    }

    .history-item .event.state-yes {
      color: #f66;
    }

    .history-item .event.state-red-alert {
      color: #d33;
    }

    .history-item .event.state-blue-alert {
      color: #08f;
    }

    .history-item .event.state-unknown-alert {
      color: #b70;
    }

    .history-item .event.state-blue {
      color: #08f;
    }

    .history-item .conf {
      color: #888;
      font-size: 0.7rem;
    }

    .history-empty {
      color: #444;
      font-size: 0.8rem;
      text-align: center;
      padding: 12px;
    }

    /* --- System Info --- */
    .sys-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      margin-bottom: 10px;
    }

    .sys-card {
      background: #0e0e16;
      border-radius: 8px;
      padding: 6px 8px;
      text-align: center;
    }

    .sys-card .val {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .sys-card .lbl {
      font-size: 0.55rem;
      color: #555;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .sys-card .val.hot {
      color: #e44;
    }

    .sys-card .val.warm {
      color: #da0;
    }

    .sys-card .val.cool {
      color: #0a7;
    }

    /* --- Score History (debug) --- */
    .score-history-section {
      margin-bottom: 10px;
      padding: 8px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #dde3ea;
    }

    .score-history-label {
      font-size: 0.65rem;
      color: #4b5563;
      text-transform: uppercase;
      margin-bottom: 4px;
      font-weight: 800;
    }

    .score-canvas {
      width: 100%;
      height: 150px;
      border-radius: 8px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      display: block;
    }

    .score-history-stats {
      font-size: 0.6rem;
      color: #374151;
      margin-top: 4px;
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .score-history-stats span {
      font-weight: 800;
    }

    .tab-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .tab-btn {
      min-height: 44px;
      border: 1px solid #ccd6df;
      border-radius: 8px;
      background: #fff;
      color: #1d2530;
      font-weight: 900;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }

    body.dark-mode .tab-btn {
      background: #151522;
      border-color: #333;
      color: #ddd;
    }

    body.dark-mode .tab-btn.active {
      background: #f5f7fa;
      color: #111827;
      border-color: #f5f7fa;
    }

    .view-panel {
      display: none;
    }

    .view-panel.active {
      display: block;
    }

    .channel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 10px;
    }

    .channel-card {
      background: #fff;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      padding: 8px;
    }

    body.dark-mode .channel-card {
      background: #0e0e16;
      border-color: #293142;
    }

    .channel-card .title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.68rem;
      color: #4b5563;
      font-weight: 900;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    body.dark-mode .channel-card .title {
      color: #cbd5e1;
    }

    .channel-score {
      color: #0a7;
      font-size: 0.72rem;
    }

    .channel-detect-toggle {
      min-height: 30px;
      margin-top: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #4b5563;
      font-size: 0.68rem;
      font-weight: 900;
      text-transform: uppercase;
    }

    body.dark-mode .channel-detect-toggle {
      color: #cbd5e1;
    }

    .channel-disabled .channel-score,
    .channel-disabled .value {
      color: #64748b !important;
    }

    .mel-canvas {
      width: 100%;
      height: 120px;
      display: block;
      border-radius: 6px;
      background: #090d14;
      image-rendering: pixelated;
    }

    .mel-plot {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 34px;
      gap: 8px;
      align-items: stretch;
    }

    .mel-scale {
      display: grid;
      grid-template-columns: 16px 1fr;
      gap: 4px;
      min-height: 120px;
    }

    .mel-colorbar {
      width: 16px;
      height: 120px;
      border-radius: 4px;
      border: 1px solid rgba(15, 23, 42, 0.18);
      background: #090d14;
      display: block;
      image-rendering: pixelated;
    }

    body.dark-mode .mel-colorbar {
      border-color: rgba(203, 213, 225, 0.18);
    }

    .mel-scale-labels {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: #64748b;
      font-size: 0.54rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    body.dark-mode .mel-scale-labels {
      color: #94a3b8;
    }

    .button-strip {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .button-chip {
      min-height: 28px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eef3f7;
      color: #1d2530;
      border: 1px solid #d7e1ea;
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .button-chip.green { color: #057a55; }
    .button-chip.yellow { color: #9a6700; }
    .button-chip.red { color: #c92a2a; }

    body.dark-mode .button-chip {
      background: #151522;
      border-color: #293142;
      color: #ddd;
    }

    body.dark-mode .score-history-section {
      background: #0e0e16;
      border-color: #293142;
    }

    body.dark-mode .score-history-label {
      color: #cbd5e1;
    }

    body.dark-mode .score-canvas {
      background: #090d14;
      border-color: #293142;
    }

    body.dark-mode .score-history-stats {
      color: #d8dee9;
    }

    /* --- Health Bar --- */
    .health-bar {
      display: flex;
      gap: 4px;
      margin-bottom: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .health-pill {
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .pill-ok {
      background: #0a72;
      color: #0a7;
    }

    .pill-warn {
      background: #da02;
      color: #da0;
    }

    .pill-bad {
      background: #e442;
      color: #e44;
    }

    .pill-blue {
      background: #08f2;
      color: #08f;
    }

    /* --- Footer --- */
    .footer {
      margin-top: 10px;
      font-size: 0.6rem;
      color: #444;
      text-align: center;
    }

    body.dark-mode {
      background: #0d0d0d;
      color: #e0e0e0;
    }

    body:not(.dark-mode) .status-card,
    body:not(.dark-mode) .sys-card,
    body:not(.dark-mode) .history-scroll,
    body:not(.dark-mode) .score-history-section,
    body:not(.dark-mode) .advanced-panel,
    body:not(.dark-mode) .trace-table {
      background: #fff;
      border: 1px solid #dde3ea;
    }

    body:not(.dark-mode) .history-item {
      background: #f8fafc;
      border: 1px solid #e6ebf0;
    }

    body:not(.dark-mode) .vu-track {
      background: #e8edf3;
      border-color: #d8e0e8;
    }

    body:not(.dark-mode) .state-card.state-no {
      background: #eef3f7;
      border-color: #d7e1ea;
    }

    body:not(.dark-mode) .state-card.state-yes,
    body:not(.dark-mode) .state-card.state-red-alert {
      background: #fff0f0;
      border-color: #d33;
    }

    body:not(.dark-mode) .state-card.state-blue-alert {
      background: #edf5ff;
      border-color: #08f;
    }

    body:not(.dark-mode) .state-card.state-unknown-alert {
      background: #fff8e8;
      border-color: #da0;
    }

    .advanced-toggle {
      width: 100%;
      min-height: 44px;
      margin-bottom: 8px;
      border: 1px solid #ccd6df;
      border-radius: 8px;
      background: #fff;
      color: #1d2530;
      font-weight: 700;
      cursor: pointer;
    }

    body.dark-mode .advanced-toggle {
      background: #151522;
      border-color: #333;
      color: #e0e0e0;
    }

    .advanced-panel {
      display: none;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 10px;
      padding: 10px;
      border-radius: 8px;
      background: #fff;
    }

    .advanced-panel.open {
      display: flex;
    }

    .profile-select {
      width: 100%;
      min-height: 34px;
      border: 1px solid #ccd6df;
      border-radius: 8px;
      background: #fff;
      color: #111827;
      font-size: 1rem;
      font-weight: 800;
      padding: 4px 8px;
    }

    body.dark-mode .profile-select {
      background: #151522;
      border-color: #333;
      color: #f5f7fa;
    }

    .advanced-panel label {
      min-height: 36px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #45515f;
    }

    body.dark-mode .advanced-panel label {
      color: #aaa;
    }

    .advanced-actions {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .doa-controls {
      width: 100%;
      display: grid;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid rgba(148, 163, 184, 0.35);
    }

    .doa-row,
    .doa-channel-list {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .doa-channel-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 32px;
      padding: 5px 7px;
      border-radius: 6px;
      background: rgba(15, 23, 42, 0.08);
      font-size: 0.75rem;
      font-weight: 800;
    }

    body.dark-mode .doa-channel-chip {
      background: rgba(255, 255, 255, 0.08);
    }

    .advanced-test-btn {
      min-height: 44px;
      border: 1px solid transparent;
      border-radius: 8px;
      color: #fff;
      font-size: 0.76rem;
      font-weight: 900;
      cursor: pointer;
    }

    .advanced-test-btn.red {
      background: #c92a2a;
      border-color: #9f1f1f;
    }

    .advanced-test-btn.blue {
      background: #0869c7;
      border-color: #07569f;
    }

    .advanced-test-btn.unknown {
      background: #f0b429;
      border-color: #b77900;
      color: #111827;
    }

    body.dark-mode .advanced-test-btn.unknown {
      color: #0d0d0d;
    }

    .trace-section {
      display: none;
      margin-bottom: 10px;
    }

    .trace-table {
      width: 100%;
      border-collapse: collapse;
      border-radius: 8px;
      overflow: hidden;
      font-size: 0.72rem;
      background: #fff;
    }

    .trace-table th,
    .trace-table td {
      padding: 6px;
      border-bottom: 1px solid #e6ebf0;
      text-align: right;
      white-space: nowrap;
    }

    .trace-table th:first-child,
    .trace-table td:first-child {
      text-align: left;
    }

    body.dark-mode .trace-table {
      background: #0e0e16;
    }

    body.dark-mode .trace-table th,
    body.dark-mode .trace-table td {
      border-bottom-color: #222;
    }

    .label-actions {
      display: none;
      gap: 4px;
      margin-left: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .labeling-on .label-actions {
      display: flex;
    }

    .label-btn {
      border: 1px solid #ccd6df;
      background: #fff;
      color: #1d2530;
      border-radius: 6px;
      padding: 5px 7px;
      min-height: 28px;
      font-size: 0.66rem;
      font-weight: 700;
      cursor: pointer;
    }

    body.dark-mode .label-btn {
      background: #181822;
      border-color: #333;
      color: #ddd;
    }

    .operator-label {
      color: #0a7;
      font-size: 0.65rem;
      margin-left: 6px;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <h1><span class="dot green" id="recDot"></span>AUDI — Type A</h1>

  <!-- Health pills -->
  <div class="health-bar" id="healthBar"></div>

  <div class="tab-row">
    <button class="tab-btn active" id="tabLive" onclick="setView('live')">Live</button>
    <button class="tab-btn" id="tabMels" onclick="setView('mels')">Mels</button>
  </div>

  <button class="advanced-toggle" id="advancedToggle" onclick="toggleAdvanced()">Advanced</button>
  <div class="advanced-panel" id="advancedPanel">
    <label><input type="checkbox" id="darkModeToggle" onchange="setDarkMode(this.checked)"> Dark mode</label>
    <label><input type="checkbox" id="colorTraceToggle" onchange="setColorTrace(this.checked)"> Color trace</label>
    <label><input type="checkbox" id="labelingToggle" onchange="setLabeling(this.checked)"> Labeling buttons</label>
    <label><input type="checkbox" id="blueAlertToggle" onchange="setAlertRouting()"> Alert on blue</label>
    <label><input type="checkbox" id="unknownAlertToggle" onchange="setAlertRouting()"> Alert on unknown</label>
    <div class="doa-controls" id="doaControls"></div>
    <div class="advanced-actions">
      <button class="advanced-test-btn red" onclick="testAlert('RED_ALERT')">Test Red</button>
      <button class="advanced-test-btn blue" onclick="testAlert('BLUE_ALERT')">Test Blue</button>
      <button class="advanced-test-btn unknown" onclick="testAlert('UNKNOWN_ALERT')">Test Unknown</button>
    </div>
  </div>

  <div class="button-strip" id="buttonEvents"></div>

  <div class="view-panel active" id="liveView">
    <!-- Status grid -->
    <div class="status-grid" id="statusGrid"></div>

    <!-- VU Meter -->
    <div class="vu-section">
      <div class="vu-label">Audio Input</div>
      <div class="vu-track">
        <div class="vu-fill" id="vuFill" style="width:0%"></div>
        <span class="vu-label-inline">VU</span>
        <span class="vu-db" id="vuDb">-inf dB</span>
      </div>
    </div>

    <div class="channel-grid" id="channelStatusGrid"></div>

    <!-- Score History (debug only) -->
    <div class="score-history-section" id="scoreHistorySection" style="display:none">
      <div class="score-history-label">Prediction Score History</div>
      <canvas class="score-canvas" id="scoreCanvas" width="780" height="150"></canvas>
      <div class="score-history-stats" id="scoreStats"></div>
    </div>

    <div class="trace-section" id="colorTraceSection">
      <div class="score-history-label">Color Trace</div>
      <div id="colorTraceTable"></div>
    </div>

    <!-- State: YES / BLUE / NO -->
    <div class="state-card state-no" id="stateCard">
      <div class="state-label no" id="stateLabel">NO</div>
      <div class="state-sub" id="stateSub">Nothing detected</div>
      <div class="state-confidences" id="stateConfs">
        <div class="state-conf-item">
          <div class="val" style="color:#e44" id="yesVal">0.00</div>
          <div class="lbl">YES</div>
        </div>
        <div class="state-conf-item">
          <div class="val" style="color:#f55" id="redVal">--</div>
          <div class="lbl">RED</div>
        </div>
        <div class="state-conf-item">
          <div class="val" style="color:#4af" id="blueVal">--</div>
          <div class="lbl">BLUE</div>
        </div>
      </div>
      <div class="threshold-info" id="thresholdInfo">YES >= 0.70 &nbsp; RED >= 0.50</div>
    </div>

    <!-- Action buttons -->
    <div class="btn-group btn-group-primary">
      <button class="btn btn-start" id="btnRecord" onclick="toggleRecording()" disabled>...</button>
    </div>
    <div class="btn-group btn-group-secondary">
      <button class="btn btn-silence" id="btnSilence" onclick="clearAlarm()">Silence</button>
      <button class="btn btn-pause" id="btnPause" onclick="pauseRecording()">Pause 5m</button>
      <button class="btn btn-close" id="btnClose" onclick="closeBrowser()">Close</button>
    </div>

    <!-- System Info -->
    <div class="sys-grid" id="sysGrid"></div>

    <!-- Alert history -->
    <div class="history">
      <h2>Alert History</h2>
      <div class="history-scroll" id="alertHistoryList"></div>
    </div>
  </div>

  <div class="view-panel" id="melsView">
    <div class="score-history-label">Processed Mel Views - last 120s in browser</div>
    <div class="channel-grid" id="melGrid">
      <div class="channel-card"><div class="title"><span>CH 0</span><span class="channel-score" id="melScore0">--</span></div><div class="mel-plot"><canvas class="mel-canvas" id="melCanvas0" width="320" height="128"></canvas><div class="mel-scale"><canvas class="mel-colorbar" id="melColorbar0" width="16" height="128"></canvas><div class="mel-scale-labels"><span>0</span><span>-40</span><span>-80</span></div></div></div></div>
      <div class="channel-card"><div class="title"><span>CH 1</span><span class="channel-score" id="melScore1">--</span></div><div class="mel-plot"><canvas class="mel-canvas" id="melCanvas1" width="320" height="128"></canvas><div class="mel-scale"><canvas class="mel-colorbar" id="melColorbar1" width="16" height="128"></canvas><div class="mel-scale-labels"><span>0</span><span>-40</span><span>-80</span></div></div></div></div>
      <div class="channel-card"><div class="title"><span>CH 2</span><span class="channel-score" id="melScore2">--</span></div><div class="mel-plot"><canvas class="mel-canvas" id="melCanvas2" width="320" height="128"></canvas><div class="mel-scale"><canvas class="mel-colorbar" id="melColorbar2" width="16" height="128"></canvas><div class="mel-scale-labels"><span>0</span><span>-40</span><span>-80</span></div></div></div></div>
      <div class="channel-card"><div class="title"><span>CH 3</span><span class="channel-score" id="melScore3">--</span></div><div class="mel-plot"><canvas class="mel-canvas" id="melCanvas3" width="320" height="128"></canvas><div class="mel-scale"><canvas class="mel-colorbar" id="melColorbar3" width="16" height="128"></canvas><div class="mel-scale-labels"><span>0</span><span>-40</span><span>-80</span></div></div></div></div>
    </div>
  </div>

  <div class="footer" id="footer"></div>

  <script>
    let lastAlarmState = false;
    let advancedOpen = localStorage.getItem('audiAdvanced') === '1';
    let colorTraceEnabled = localStorage.getItem('audiColorTrace') === '1';
    let labelingEnabled = localStorage.getItem('audiLabeling') === '1';
    let darkModeEnabled = localStorage.getItem('audiDarkMode') === '1';
    let alertRoutingSyncing = false;
    let currentView = localStorage.getItem('audiView') || 'live';
    const melHistory = [[], [], [], []];
    const lastMelKeys = [null, null, null, null];
    const melHistoryMaxAgeMs = 120000;

    function applyUiPrefs() {
      document.body.classList.toggle('dark-mode', darkModeEnabled);
      document.body.classList.toggle('labeling-on', labelingEnabled);
      document.getElementById('advancedPanel').classList.toggle('open', advancedOpen);
      document.getElementById('darkModeToggle').checked = darkModeEnabled;
      document.getElementById('colorTraceToggle').checked = colorTraceEnabled;
      document.getElementById('labelingToggle').checked = labelingEnabled;
      document.getElementById('advancedToggle').textContent = advancedOpen ? 'Advanced ▲' : 'Advanced ▼';
      document.getElementById('liveView').classList.toggle('active', currentView === 'live');
      document.getElementById('melsView').classList.toggle('active', currentView === 'mels');
      document.getElementById('tabLive').classList.toggle('active', currentView === 'live');
      document.getElementById('tabMels').classList.toggle('active', currentView === 'mels');
    }

    function setView(view) {
      currentView = view;
      localStorage.setItem('audiView', view);
      applyUiPrefs();
      if (view === 'mels') updateMels();
    }

    function applyDetectorPrefs(det) {
      alertRoutingSyncing = true;
      document.getElementById('blueAlertToggle').checked = !!det.alert_on_blue;
      document.getElementById('unknownAlertToggle').checked = !!det.alert_on_unknown;
      alertRoutingSyncing = false;
    }

    function toggleAdvanced() {
      advancedOpen = !advancedOpen;
      localStorage.setItem('audiAdvanced', advancedOpen ? '1' : '0');
      applyUiPrefs();
    }

    function setDarkMode(enabled) {
      darkModeEnabled = enabled;
      localStorage.setItem('audiDarkMode', enabled ? '1' : '0');
      applyUiPrefs();
    }

    function setColorTrace(enabled) {
      colorTraceEnabled = enabled;
      localStorage.setItem('audiColorTrace', enabled ? '1' : '0');
      applyUiPrefs();
      update();
    }

    function setLabeling(enabled) {
      labelingEnabled = enabled;
      localStorage.setItem('audiLabeling', enabled ? '1' : '0');
      applyUiPrefs();
      update();
    }

    function setAlertRouting() {
      if (alertRoutingSyncing) return;
      fetch('/api/alert_routing', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          alert_on_blue: document.getElementById('blueAlertToggle').checked,
          alert_on_unknown: document.getElementById('unknownAlertToggle').checked
        })
      }).then(() => update()).catch(() => {});
    }

    function setDetectorChannel(channelIndex, enabled) {
      fetch('/api/detector_channel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel_index: channelIndex, enabled })
      }).then(() => update()).catch(() => {});
    }

    function setDOAProfile(profile) {
      fetch('/api/doa_profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile })
      }).then(() => update()).catch(() => {});
    }

    function setDOAChannel(channelIndex, enabled) {
      fetch('/api/doa_channel', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ channel_index: channelIndex, enabled })
      }).then(() => update()).catch(() => {});
    }

    function alertLabel(level) {
      if (level === 'RED_ALERT') return 'RED ALERT';
      if (level === 'BLUE_ALERT') return 'BLUE ALERT';
      if (level === 'UNKNOWN_ALERT') return 'UNKNOWN ALERT';
      if (level === 'DETECTED') return 'DETECTED';
      return 'NO';
    }

    function alertClass(level) {
      return (level || 'NO').toLowerCase().replaceAll('_', '-');
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function profileControl(det) {
      const profiles = det.threshold_profiles || [];
      const active = det.threshold_profile || 'manual';
      if (!profiles.length) {
        return `<div class="value white">${escapeHtml(active)}</div>`;
      }
      return `<select class="profile-select" id="profileSelect" onchange="setThresholdProfile(this.value)">
        ${profiles.map(profile => `
          <option value="${escapeHtml(profile)}" ${profile === active ? 'selected' : ''}>
            ${escapeHtml(profile)}
          </option>
        `).join('')}
      </select>`;
    }

    function doaProfileControl(doa) {
      const profiles = doa.profiles || [];
      const active = doa.active_profile || 'default';
      if (!doa.enabled) return '<span class="value white">Disabled</span>';
      if (!profiles.length) return `<span>${escapeHtml(active)}</span>`;
      return `<select class="profile-select" id="doaProfileSelect" onchange="setDOAProfile(this.value)">
        ${profiles.map(profile => `
          <option value="${escapeHtml(profile)}" ${profile === active ? 'selected' : ''}>
            ${escapeHtml(profile)}
          </option>
        `).join('')}
      </select>`;
    }

    function drawDOAControls(doa) {
      const panel = document.getElementById('doaControls');
      if (!panel) return;
      const confidence = doa.confidence == null ? '--' : Number(doa.confidence).toFixed(2);
      const raw = doa.raw_azimuth_deg == null ? '--' : `${Number(doa.raw_azimuth_deg).toFixed(0)}deg`;
      const smooth = doa.azimuth_deg == null ? '--' : `${Number(doa.azimuth_deg).toFixed(0)}deg`;
      const channels = (doa.channels || []).map(ch => `
        <label class="doa-channel-chip">
          <input type="checkbox" ${ch.enabled ? 'checked' : ''} onchange="setDOAChannel(${Number(ch.channel_index)}, this.checked)">
          M${Number(ch.channel_index)}
        </label>
      `).join('');
      panel.innerHTML = `
        <div class="doa-row"><strong>DOA</strong>${doaProfileControl(doa)}</div>
        <div class="doa-row">Smooth ${smooth} Raw ${raw} Conf ${confidence}</div>
        <div class="doa-channel-list">${channels || '<span>No profile mics</span>'}</div>
      `;
    }

    function update() {
      // --- Status poll ---
      fetch('/api/status').then(r => r.json()).then(d => {
        const rec = d.recorder || {};
        const st = d.storage || {};
        const det = d.detector || {};
        const doa = d.doa || {};
        const gp = d.gpio || {};
        applyDetectorPrefs(det);
        drawDOAControls(doa);

        const alarming = gp.alarming || false;
        const recording = rec.running && !rec.stopped;
        const paused = rec.paused || false;
        const healthy = rec.audio_healthy;

        // Dot color based on detection state
        const dot = document.getElementById('recDot');
        const state = det.current_state || 'NO';
        const alertLevel = det.alert_level || state;
        if (alertLevel === 'RED_ALERT') dot.className = 'dot red';
        else if (alertLevel === 'BLUE_ALERT') dot.className = 'dot blue';
        else if (alertLevel === 'UNKNOWN_ALERT') dot.className = 'dot yellow';
        else if (paused) dot.className = 'dot yellow';
        else if (recording && healthy) dot.className = 'dot green';
        else if (recording && !healthy) dot.className = 'dot yellow';
        else dot.className = 'dot gray';

        // Status grid
        const avgMs = det.timing_avg_ms || 0;
        document.getElementById('statusGrid').innerHTML = `
      <div class="status-card">
        <div class="label">Recording</div>
        <div class="value ${recording && healthy ? 'green' : paused ? 'amber' : 'red'}">
          ${paused ? 'Paused' : recording ? (healthy ? 'Active' : 'No Audio') : 'Stopped'}
        </div>
      </div>
      <div class="status-card">
        <div class="label">Detections</div>
        <div class="value white">
          Y ${det.yes_count || 0} / R ${det.red_count || 0} / B ${det.blue_count || 0}
        </div>
      </div>
      <div class="status-card">
        <div class="label">Inference</div>
        <div class="value ${avgMs < 150 ? 'green' : avgMs < 250 ? 'amber' : 'red'}">
          ${avgMs.toFixed(0)}ms avg
        </div>
      </div>
      <div class="status-card">
        <div class="label">Profile</div>
        ${profileControl(det)}
      </div>
      <div class="status-card">
        <div class="label">Direction</div>
        <div class="value ${doa.azimuth_deg == null ? 'white' : 'green'}">
          ${doa.azimuth_deg == null ? 'Idle' : `${Number(doa.azimuth_deg).toFixed(0)}deg ${doa.confidence == null ? '' : Number(doa.confidence).toFixed(2)}`}
        </div>
      </div>
    `;
        drawChannelStatus(det.channels || [], rec.channel_health || []);
        drawButtonEvents(gp.button_events || []);

        // State card
        const card = document.getElementById('stateCard');
        const label = document.getElementById('stateLabel');
        const sub = document.getElementById('stateSub');
        card.className = 'state-card state-' + alertClass(alertLevel);
        const color = det.drone_color || 'UNKNOWN';
        const colorText = color === 'UNKNOWN' ? '' : ` - ${color}`;
        if (state === 'YES') {
          label.className = 'state-label ' + alertClass(alertLevel);
          label.textContent = alertLabel(alertLevel);
          sub.textContent = `Snapshot saved${colorText}`;
        } else {
          label.className = 'state-label no'; label.textContent = 'NO';
          sub.textContent = color === 'UNKNOWN' ? 'Nothing detected' : `Last typed ${color}`;
        }
        document.getElementById('yesVal').textContent = (det.yes_confidence || 0).toFixed(2);
        document.getElementById('redVal').textContent =
          det.red_confidence == null ? '--' : det.red_confidence.toFixed(2);
        document.getElementById('blueVal').textContent =
          det.blue_confidence == null ? '--' : det.blue_confidence.toFixed(2);
        document.getElementById('thresholdInfo').textContent =
          'YES >= ' + (det.threshold_yes || 0.7).toFixed(2) +
          '  RED >= ' + (det.red_color_threshold || 0.6).toFixed(2) +
          '  BLUE >= ' + (det.blue_color_threshold || 0.6).toFixed(2) +
          (det.blue_red_model_loaded ? '' : '  color model offline');

        // Record button — same state as the recording label
        const btn = document.getElementById('btnRecord');
        btn.disabled = false;
        if (recording && !paused) {
          btn.textContent = 'Stop';
          btn.className = 'btn btn-stop';
        } else {
          btn.textContent = 'Start';
          btn.className = 'btn btn-start';
        }

        // Score history: each channel is an independent detector stream.
        if (det.channel_score_history || det.score_history) {
          drawScoreHistory(
            det.channel_score_history || det.score_history,
            det.threshold_yes || 0.51
          );
        } else {
          document.getElementById('scoreHistorySection').style.display = 'none';
        }
        drawColorTrace(det.color_trace || []);
      });

      // --- System info ---
      fetch('/api/system').then(r => r.json()).then(d => {
        const temp = d.cpu_temperature_c || 0;
        const mem = d.memory || {};
        const load = d.load || {};
        const up = d.uptime_str || '0h 0m';
        const disk = d.disk || {};

        const tempColor = temp > 75 ? 'hot' : temp > 60 ? 'warm' : 'cool';
        const memPct = mem.used_pct || 0;
        const memColor = memPct > 85 ? 'hot' : memPct > 65 ? 'warm' : 'cool';

        document.getElementById('sysGrid').innerHTML = `
      <div class="sys-card"><div class="val ${tempColor}">${temp.toFixed(1)}°</div><div class="lbl">CPU Temp</div></div>
      <div class="sys-card"><div class="val ${memColor}">${memPct}%</div><div class="lbl">RAM</div></div>
      <div class="sys-card"><div class="val">${up}</div><div class="lbl">Uptime</div></div>
    `;
      }).catch(e => console.warn('system info:', e));

      // --- Health pills ---
      fetch('/api/status').then(r => r.json()).then(d => {
        const rec = d.recorder || {};
        const st = d.storage || {};
        const gp = d.gpio || {};
        const det = d.detector || {};
        const state = det.current_state || 'NO';
        const alertLevel = det.alert_level || state;
        const pills = [];

        if (state === 'YES') {
          const cls = alertLevel === 'BLUE_ALERT' ? 'pill-blue' : alertLevel === 'UNKNOWN_ALERT' ? 'pill-warn' : 'pill-bad';
          pills.push({ label: alertLabel(alertLevel), cls });
        }
        else if (rec.running && rec.audio_healthy) pills.push({ label: 'Audio OK', cls: 'pill-ok' });
        else if (rec.running && !rec.audio_healthy) pills.push({ label: 'No Audio', cls: 'pill-warn' });
        else pills.push({ label: 'Stopped', cls: 'pill-bad' });

        if (st.over_budget) pills.push({ label: 'Full', cls: 'pill-warn' });
        else pills.push({ label: `${(st.used_gb || 0).toFixed(1)}G`, cls: 'pill-ok' });
        pills.push({ label: `GPIO ${gp.has_gpio ? 'OK' : 'MOCK'}`, cls: gp.has_gpio ? 'pill-ok' : 'pill-warn' });

        document.getElementById('healthBar').innerHTML = pills.map(p =>
          `<span class="health-pill ${p.cls}">${p.label}</span>`
        ).join('');
      }).catch(() => { });

      // --- Alert history ---
      fetch('/api/alert_history_persistent').then(r => r.json()).then(d => {
        const list = document.getElementById('alertHistoryList');
        const h = d.history || [];
        if (h.length === 0) {
          list.innerHTML = '<div class="history-empty">No alerts logged</div>';
          return;
        }
        list.innerHTML = h.reverse().slice(0, 30).map(e => {
          const t = new Date(e.timestamp * 1000);
          const state = e.state || 'NO';
          const alertLevel = e.alert_level || state;
          const yesC = (e.yes_confidence * 100).toFixed(0) || '0';
          const redC = e.red_confidence == null ? '--' : (e.red_confidence * 100).toFixed(0);
          const channel = e.firing_channel_name || e.channel_name ||
            (e.firing_channel_index != null ? `ch${e.firing_channel_index}` :
              e.channel_index != null ? `ch${e.channel_index}` : '');
          const color = e.drone_color && e.drone_color !== 'UNKNOWN' ? ` ${e.drone_color}` : '';
          const labelText = e.operator_label ? `<span class="operator-label">${e.operator_label.replace('_', ' ')}</span>` : '';
          const labelActions = e.alert_id ? `<span class="label-actions">
            <button class="label-btn" onclick="labelAlert('${e.alert_id}','no_drone')">No</button>
            <button class="label-btn" onclick="labelAlert('${e.alert_id}','drone_red')">Red</button>
            <button class="label-btn" onclick="labelAlert('${e.alert_id}','drone_blue')">Blue</button>
            <button class="label-btn" onclick="labelAlert('${e.alert_id}','unclear')">?</button>
          </span>` : '';
          return `<div class="history-item">
        <span class="time">${t.toLocaleDateString()} ${t.toLocaleTimeString()}</span>
        <span class="event state-${alertClass(alertLevel)}">${alertLabel(alertLevel)}${color} ${escapeHtml(channel)}${labelText}</span>
        <span class="conf">Y:${yesC}% R:${redC}%</span>
        ${labelActions}
      </div>`;
        }).join('');
      }).catch(() => { });

      document.getElementById('footer').textContent =
        'AUDI Type A v0.3.0 | ' + new Date().toLocaleTimeString();
    }

    function drawButtonEvents(events) {
      const strip = document.getElementById('buttonEvents');
      const recent = (events || []).slice(-8).reverse();
      if (!recent.length) {
        strip.innerHTML = '<span class="button-chip">No button presses</span>';
        return;
      }
      strip.innerHTML = recent.map(e => {
        const name = escapeHtml(e.name || 'button');
        const cls = ['green', 'yellow', 'red'].includes(e.name) ? e.name : '';
        const t = e.timestamp ? new Date(e.timestamp * 1000).toLocaleTimeString() : '--';
        return `<span class="button-chip ${cls}">${name} GPIO ${e.gpio} ${t}</span>`;
      }).join('');
    }

    function drawChannelStatus(channels, healthRows) {
      const grid = document.getElementById('channelStatusGrid');
      const rows = [];
      for (let i = 0; i < 4; i++) {
        const ch = (channels || []).find(c => Number(c.channel_index) === i) || { channel_index: i };
        const health = (healthRows || []).find(c => Number(c.channel_index) === i) || {};
        const alertLevel = ch.alert_level || ch.state || 'NO';
        const detectorEnabled = ch.detector_enabled !== false;
        const yes = Number(ch.yes_confidence || ch.raw_score || 0);
        const color = ch.drone_color || 'UNKNOWN';
        const dbfs = Number(health.dbfs);
        const healthLabel = health.frames
          ? `${Number.isFinite(dbfs) ? dbfs.toFixed(1) : '--'} dB`
          : 'No frames';
        const clip = Number(health.clipping_percent || 0);
        const healthClass = health.healthy ? (clip > 1 ? 'amber' : 'green') : 'red';
        rows.push(`<div class="channel-card ${detectorEnabled ? '' : 'channel-disabled'}">
          <div class="title"><span>CH ${i}</span><span class="channel-score">${detectorEnabled ? alertLabel(alertLevel) : 'DISABLED'}</span></div>
          <div class="status-card" style="padding:6px;border-radius:6px">
            <div class="label">Score</div>
            <div class="value ${alertLevel === 'NO' ? 'white' : alertLevel === 'RED_ALERT' ? 'red' : 'green'}">${detectorEnabled ? `${yes.toFixed(2)} ${escapeHtml(color)}` : 'Skipped'}</div>
          </div>
          <div class="status-card" style="padding:6px;border-radius:6px;margin-top:6px">
            <div class="label">Input</div>
            <div class="value ${healthClass}">${healthLabel} P ${Number(health.peak || 0).toFixed(2)}</div>
          </div>
          <label class="channel-detect-toggle">
            <input type="checkbox" ${detectorEnabled ? 'checked' : ''} onchange="setDetectorChannel(${i}, this.checked)">
            Detect
          </label>
        </div>`);
        const score = document.getElementById(`melScore${i}`);
        if (score) score.textContent = detectorEnabled ? `${alertLabel(alertLevel)} ${yes.toFixed(2)}` : 'DISABLED';
      }
      grid.innerHTML = rows.join('');
    }

    // --- Actions ---
    function apiPost(url, payload = null) {
      const options = { method: 'POST' };
      if (payload) {
        options.headers = { 'Content-Type': 'application/json' };
        options.body = JSON.stringify(payload);
      }
      fetch(url, options).then(() => update()).catch(() => {});
    }
    function toggleRecording() {
      // Read state from the server, not from the button text.
      // The server knows the real recording state.
      fetch('/api/toggle_recording', { method: 'POST' })
        .then(r => r.json())
        .then(d => {
          const btn = document.getElementById('btnRecord');
          if (d.recording) {
            btn.textContent = 'Stop';
            btn.className = 'btn btn-stop';
          } else {
            btn.textContent = 'Start';
            btn.className = 'btn btn-start';
          }
        })
        .catch(() => {})
        .finally(() => update());
    }
    function clearAlarm()     { apiPost('/api/clear_alarm');     }
    function pauseRecording() { apiPost('/api/pause_recording'); }
    function testAlert(alertLevel = 'RED_ALERT') {
      apiPost('/api/test_alert', { alert_level: alertLevel });
    }
    function closeBrowser() {
      window.close();
      setTimeout(() => {
        document.body.innerHTML = '<div style="padding:24px;font:16px system-ui">You can close this browser tab.</div>';
      }, 150);
    }

    function setThresholdProfile(profile) {
      fetch('/api/threshold_profile', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ profile })
      }).then(() => update()).catch(() => {});
    }

    function labelAlert(alertId, label) {
      fetch('/api/label_alert', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ alert_id: alertId, label })
      }).then(() => update()).catch(() => {});
    }

    function updateVU() {
      fetch('/api/audio_level').then(r => r.json()).then(d => {
        const rms = Number(d.rms) || 0;
        let db = Number(d.db);
        if (!Number.isFinite(db) || db < -120 || db > 6) {
          db = rms > 0 ? 20 * Math.log10(Math.max(rms, 0.000001)) : -120;
        }
        db = Math.max(-120, Math.min(0, db));
        const apiPercent = Number(d.vu_percent);
        const vuPercent = Number.isFinite(apiPercent)
          ? apiPercent
          : ((db + 120) / 120) * 100;
        document.getElementById('vuFill').style.width = Math.max(0, Math.min(100, vuPercent)) + '%';
        document.getElementById('vuDb').textContent = Math.round(db) + ' dB';
      }).catch(() => { });
    }

    function drawColorTrace(trace) {
      const section = document.getElementById('colorTraceSection');
      if (!colorTraceEnabled || !trace || trace.length === 0) {
        section.style.display = 'none';
        return;
      }
      section.style.display = 'block';
      const rows = trace.slice(-12).reverse().map(e => {
        const t = new Date(e.ts * 1000).toLocaleTimeString();
        const red = e.red_confidence == null ? '--' : e.red_confidence.toFixed(2);
        const blue = e.blue_confidence == null ? '--' : e.blue_confidence.toFixed(2);
        return `<tr>
          <td>${t}</td>
          <td>CH ${e.channel_index ?? '--'} ${alertLabel(e.alert_level)}</td>
          <td>${(e.raw_score || 0).toFixed(2)}</td>
          <td>${red}</td>
          <td>${blue}</td>
          <td>${e.drone_color || 'UNKNOWN'}</td>
        </tr>`;
      }).join('');
      document.getElementById('colorTraceTable').innerHTML =
        `<table class="trace-table">
          <thead><tr><th>Time</th><th>Level</th><th>Drone</th><th>Red</th><th>Blue</th><th>Type</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
    }

    function updateMels() {
      fetch('/api/mels?source=ring_buffer&seconds=2.5&columns=12').then(r => r.json()).then(d => {
        const nowMs = Date.now();
        for (let i = 0; i < 4; i++) {
          while (melHistory[i].length && nowMs - melHistory[i][0].ts > melHistoryMaxAgeMs) {
            melHistory[i].shift();
          }
        }
        (d.channels || []).forEach(ch => {
          const idx = Number(ch.channel_index);
          if (idx < 0 || idx > 3) return;
          const apiKey = `${d.source || 'unknown'}:${d.timestamp || nowMs}:${ch.frames || 0}`;
          if (lastMelKeys[idx] === apiKey) return;
          lastMelKeys[idx] = apiKey;
          melHistory[idx].push({ ts: nowMs, mel: ch.mel || [] });
        });
        for (let i = 0; i < 4; i++) drawMelCanvas(i);
      }).catch(() => {});
    }

    function clamp01(v) {
      return Math.max(0, Math.min(1, v));
    }

    function jetColor(v) {
      v = clamp01(v);
      const r = Math.round(255 * clamp01(1.5 - Math.abs(4 * v - 3)));
      const g = Math.round(255 * clamp01(1.5 - Math.abs(4 * v - 2)));
      const b = Math.round(255 * clamp01(1.5 - Math.abs(4 * v - 1)));
      return `rgb(${r},${g},${b})`;
    }

    function melDbToJet(db, minDb, maxDb) {
      const span = Math.max(1e-6, maxDb - minDb);
      return jetColor((Number(db) - minDb) / span);
    }

    function formatDbLabel(db) {
      const rounded = Math.round(db);
      return `${rounded > 0 ? '+' : ''}${rounded}`;
    }

    function melDisplayRange(matrices) {
      const vals = [];
      matrices.forEach(mel => {
        mel.forEach(row => {
          row.forEach(v => {
            const n = Number(v);
            if (Number.isFinite(n)) vals.push(n);
          });
        });
      });
      if (!vals.length) return { min: -80, max: 0 };
      vals.sort((a, b) => a - b);
      const lo = vals[Math.floor((vals.length - 1) * 0.02)];
      const hi = vals[Math.floor((vals.length - 1) * 0.98)];
      const mid = (lo + hi) / 2;
      const span = Math.max(20, hi - lo);
      return { min: mid - span / 2, max: mid + span / 2 };
    }

    function drawMelColorbar(channelIndex, minDb, maxDb) {
      const canvas = document.getElementById(`melColorbar${channelIndex}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      for (let y = 0; y < H; y++) {
        const v = 1 - y / Math.max(1, H - 1);
        ctx.fillStyle = jetColor(v);
        ctx.fillRect(0, y, W, 1);
      }
      const labels = canvas.parentElement?.querySelectorAll('.mel-scale-labels span') || [];
      if (labels.length >= 3) {
        labels[0].textContent = formatDbLabel(maxDb);
        labels[1].textContent = formatDbLabel((minDb + maxDb) / 2);
        labels[2].textContent = formatDbLabel(minDb);
      }
    }

    function drawMelCanvas(channelIndex) {
      const canvas = document.getElementById(`melCanvas${channelIndex}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.fillStyle = '#090d14';
      ctx.fillRect(0, 0, W, H);
      const chunks = melHistory[channelIndex] || [];
      if (!chunks.length) {
        ctx.fillStyle = '#64748b';
        ctx.font = '14px system-ui';
        ctx.fillText('waiting for mel frames', 12, 24);
        return;
      }
      const matrices = chunks.map(c => c.mel).filter(m => m && m.length && m[0].length);
      if (!matrices.length) return;
      const range = melDisplayRange(matrices);
      drawMelColorbar(channelIndex, range.min, range.max);
      const nMels = matrices[0].length;
      const cols = matrices.reduce((sum, m) => sum + (m[0] ? m[0].length : 0), 0);
      const colW = Math.max(1, W / Math.max(1, cols));
      const rowH = H / nMels;
      let x = 0;
      matrices.forEach(mel => {
        const localCols = mel[0].length;
        for (let c = 0; c < localCols; c++) {
          for (let r = 0; r < nMels; r++) {
            const db = Number(mel[r][c]);
            ctx.fillStyle = melDbToJet(db, range.min, range.max);
            ctx.fillRect(x, H - (r + 1) * rowH, Math.ceil(colW), Math.ceil(rowH));
          }
          x += colW;
        }
      });
    }

    // --- Score history sparkline (canvas) ---
    function normalizeScoreSeries(history) {
      if (!history || !history.length) return [];
      if (history[0] && Array.isArray(history[0].history)) {
        return history.map(series => ({
          channelIndex: Number(series.channel_index),
          points: (series.history || []).filter(point => point && point.raw != null)
        })).filter(series => series.points.length);
      }

      const byChannel = new Map();
      history.forEach(point => {
        if (!point || point.raw == null) return;
        const idx = Number(point.channel_index || 0);
        if (!byChannel.has(idx)) byChannel.set(idx, []);
        byChannel.get(idx).push(point);
      });
      return Array.from(byChannel.entries())
        .sort((a, b) => a[0] - b[0])
        .map(([channelIndex, points]) => ({ channelIndex, points }));
    }

    function drawScoreHistory(history, threshold) {
      const section = document.getElementById('scoreHistorySection');
      section.style.display = 'block';
      const canvas = document.getElementById('scoreCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      const pad = { top: 12, right: 18, bottom: 18, left: 34 };
      const dark = document.body.classList.contains('dark-mode');
      const theme = dark ? {
        bg: '#090d14',
        gridStrong: 'rgba(203,213,225,0.28)',
        grid: 'rgba(148,163,184,0.20)',
        text: '#e5edf7',
        muted: '#a6b3c2',
        score: '#2dd4bf',
        scoreGlow: 'rgba(45,212,191,0.26)',
        fill: 'rgba(45,212,191,0.12)',
        threshold: '#ff5a5f',
        thresholdBg: 'rgba(255,90,95,0.18)',
        channelColors: ['#2dd4bf', '#60a5fa', '#f59e0b', '#f472b6']
      } : {
        bg: '#f8fafc',
        gridStrong: 'rgba(30,41,59,0.32)',
        grid: 'rgba(71,85,105,0.22)',
        text: '#111827',
        muted: '#475569',
        score: '#008c73',
        scoreGlow: 'rgba(0,140,115,0.20)',
        fill: 'rgba(0,140,115,0.12)',
        threshold: '#c92a2a',
        thresholdBg: 'rgba(201,42,42,0.12)',
        channelColors: ['#008c73', '#2563eb', '#d97706', '#db2777']
      };

      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, W, H);

      const series = normalizeScoreSeries(history);
      const allPoints = series.flatMap(s => s.points);
      if (allPoints.length < 2) {
        document.getElementById('scoreStats').innerHTML = '';
        return;
      }

      const plotW = W - pad.left - pad.right;
      const plotH = H - pad.top - pad.bottom;
      const yMin = 0;
      const yMax = 1;
      const times = allPoints.map(point => Number(point.ts || 0)).filter(Number.isFinite);
      const tMin = Math.min(...times);
      const tMax = Math.max(...times);
      const hasTimeRange = Number.isFinite(tMin) && Number.isFinite(tMax) && tMax > tMin;

      const xOf = (point, index, n) => {
        const ts = Number(point.ts || 0);
        if (hasTimeRange && Number.isFinite(ts)) {
          return pad.left + ((ts - tMin) / (tMax - tMin)) * plotW;
        }
        return pad.left + (index / Math.max(1, n - 1)) * plotW;
      };
      const yOf = v => pad.top + (1 - (v - yMin) / (yMax - yMin)) * plotH;

      // Fixed 0.0-1.0 grid: operators need threshold context more than zoom.
      ctx.font = '10px system-ui';
      ctx.textBaseline = 'middle';
      for (let step = 0; step <= 10; step++) {
        const g = step / 10;
        const gy = yOf(g);
        ctx.strokeStyle = (step === 0 || step === 10 || step === 5)
          ? theme.gridStrong
          : theme.grid;
        ctx.lineWidth = (step === 0 || step === 10 || step === 5) ? 1.2 : 0.8;
        ctx.beginPath();
        ctx.moveTo(pad.left, gy);
        ctx.lineTo(W - pad.right, gy);
        ctx.stroke();

        ctx.fillStyle = step % 2 === 0 || step === 10 ? theme.text : theme.muted;
        ctx.fillText(g.toFixed(1), 5, gy);
      }

      // Threshold line
      const thY = yOf(threshold);
      ctx.strokeStyle = theme.threshold;
      ctx.lineWidth = 2.4;
      ctx.setLineDash([8, 5]);
      ctx.beginPath();
      ctx.moveTo(pad.left, thY);
      ctx.lineTo(W - pad.right, thY);
      ctx.stroke();
      ctx.setLineDash([]);

      // Threshold label
      const thresholdLabel = 'YES >= ' + threshold.toFixed(2);
      ctx.font = 'bold 11px system-ui';
      const labelW = ctx.measureText(thresholdLabel).width + 12;
      const labelX = W - pad.right - labelW;
      const labelY = Math.max(4, Math.min(H - 20, thY - 18));
      ctx.fillStyle = theme.thresholdBg;
      ctx.fillRect(labelX, labelY, labelW, 18);
      ctx.strokeStyle = theme.threshold;
      ctx.lineWidth = 1;
      ctx.strokeRect(labelX, labelY, labelW, 18);
      ctx.fillStyle = theme.threshold;
      ctx.textBaseline = 'middle';
      ctx.fillText(thresholdLabel, labelX + 6, labelY + 9);

      series.forEach(s => {
        if (s.points.length < 2) return;
        const color = theme.channelColors[s.channelIndex % theme.channelColors.length];
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        ctx.strokeStyle = color + '44';
        ctx.lineWidth = 5;
        ctx.beginPath();
        s.points.forEach((point, i) => {
          const sx = xOf(point, i, s.points.length);
          const sy = yOf(Number(point.raw || 0));
          if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        });
        ctx.stroke();

        ctx.strokeStyle = color;
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        s.points.forEach((point, i) => {
          const sx = xOf(point, i, s.points.length);
          const sy = yOf(Number(point.raw || 0));
          if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
        });
        ctx.stroke();
      });

      // Stats
      document.getElementById('scoreStats').innerHTML = series.map(s => {
        const vals = s.points.map(point => Number(point.raw || 0));
        const latest = vals[vals.length - 1] || 0;
        const max = Math.max(...vals);
        const color = theme.channelColors[s.channelIndex % theme.channelColors.length];
        return `<span style="color:${color}">CH${s.channelIndex} ${latest.toFixed(2)} max ${max.toFixed(2)}</span>`;
      }).join('');
    }

    setInterval(update, 1500);
    setInterval(updateVU, 33);
    setInterval(() => {
      if (currentView === 'mels') updateMels();
    }, 2500);
    applyUiPrefs();
    update();
    updateVU();
    if (currentView === 'mels') updateMels();
  </script>
</body>
