<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUDI Attack Eval Results</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #c9d1d9;
    --dim: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d2991d;
    --red: #f85149;
    --header: #1c2128;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', 'JetBrains Mono', monospace;
    font-size: 13px;
    line-height: 1.4;
    padding: 20px;
    min-width: 1400px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .subtitle { color: var(--dim); margin-bottom: 16px; font-size: 12px; }
  .controls {
    display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; align-items: center;
  }
  input, select {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; font-family: inherit; font-size: 12px; border-radius: 4px;
  }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  input { width: 220px; }
  .stats { color: var(--dim); font-size: 11px; margin-bottom: 8px; }
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; white-space: nowrap; }
  th {
    background: var(--header); padding: 8px 10px; text-align: right; font-weight: 600;
    font-size: 11px; color: var(--dim); cursor: pointer; user-select: none;
    position: sticky; top: 0; z-index: 2; border-bottom: 2px solid var(--border);
  }
  th:hover { color: var(--accent); }
  th.sorted { color: var(--accent); }
  th:first-child, th:nth-child(2) { text-align: left; min-width: 100px; }
  th:first-child { width: 40px; min-width: 40px; text-align: right; padding-right: 6px; }
  td {
    padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  td:first-child { color: var(--dim); padding-right: 6px; }
  td:nth-child(2) { text-align: left; }
  tr:hover td { background: rgba(88,166,255,0.04); }
  .cov-cell { font-weight: 500; }
  .bg-cell { color: var(--dim); font-size: 11px; }
  .p50 { color: var(--green); }
  .p90 { border-left: 1px solid rgba(255,255,255,0.08); border-right: 1px solid rgba(255,255,255,0.08); }
  .bg-col { position: sticky; right: 0; background: var(--surface); }
  th.bg-col { background: var(--header); }
  .group-header {
    background: var(--surface); font-weight: 700; color: var(--accent);
    cursor: pointer; user-select: none;
  }
  .group-header td { padding: 10px 10px; font-size: 12px; }
  .hidden { display: none; }
  .sweep-tag {
    display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 3px;
    margin-left: 6px; color: var(--dim); border: 1px solid var(--border);
  }
</style>
</head>
<body>
<h1>AUDI Attack Eval — All Models × All Precision Levels</h1>
<div class="subtitle">Sorted by P90 coverage · Color: green ≥50%, yellow ≥30%, red &lt;30%</div>

<div class="controls">
  <input id="search" placeholder="Filter model/sweep..." oninput="render()">
  <select id="sweepFilter" onchange="render()">
    <option value="">All sweeps</option>
  </select>
  <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer">
    <input type="checkbox" id="showBg" onchange="render()" checked> bg columns
  </label>
  <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer">
    <input type="checkbox" id="showAlerts" onchange="render()"> alert columns
  </label>
  <span class="stats" id="stats"></span>
</div>

<div class="table-wrap" id="tableContainer"></div>

<script>
const LEVELS = ['P50','P60','P70','P75','P80','P85','P90','P95','P99'];
let DATA = [];

function covColor(v) {
  if (v == null) return 'var(--dim)';
  if (v >= 50) return 'var(--green)';
  if (v >= 30) return 'var(--yellow)';
  return 'var(--red)';
}

function bgColor(v) {
  if (v == null || v === '-') return 'var(--dim)';
  if (v === 0) return 'var(--green)';
  if (v <= 20) return 'var(--yellow)';
  return 'var(--red)';
}

function render() {
  const search = document.getElementById('search').value.toLowerCase();
  const sweepF = document.getElementById('sweepFilter').value;
  const showBg = document.getElementById('showBg').checked;
  const showAlerts = document.getElementById('showAlerts').checked;

  let filtered = DATA;
  if (search) {
    filtered = filtered.filter(d =>
      d.model.toLowerCase().includes(search) || d.sweep.toLowerCase().includes(search));
  }
  if (sweepF) {
    filtered = filtered.filter(d => d.sweep === sweepF);
  }

  document.getElementById('stats').textContent =
    `${filtered.length} models shown`;

  let html = '<table><thead><tr>';
  html += '<th onclick="sortBy(\'idx\')">#</th>';
  html += '<th onclick="sortBy(\'model\')">model</th>';
  for (const lvl of LEVELS) {
    html += `<th class="${lvl==='P90'?'p90':''}" onclick="sortBy('${lvl}_cov')">${lvl} cov</th>`;
    if (showBg) html += `<th class="bg-col" onclick="sortBy('${lvl}_bg')">bg</th>`;
    if (showAlerts) html += `<th class="bg-col" onclick="sortBy('${lvl}_alerts')">alrt</th>`;
  }
  html += '</tr></thead><tbody>';

  let lastSweep = '';
  for (let i = 0; i < filtered.length; i++) {
    const d = filtered[i];
    if (d.sweep !== lastSweep && !sweepF) {
      lastSweep = d.sweep;
      const count = filtered.filter(x => x.sweep === d.sweep).length;
      html += `<tr class="group-header" onclick="document.getElementById('sweepFilter').value='${d.sweep}';render()">
        <td colspan="100">▸ ${d.sweep} <span class="sweep-tag">${count} models</span></td></tr>`;
    }
    html += '<tr>';
    html += `<td>${i + 1}</td>`;
    html += `<td>${d.model}</td>`;
    for (const lvl of LEVELS) {
      const cov = d[lvl + '_cov'];
      const bg = d[lvl + '_bg'];
      const alerts = d[lvl + '_alerts'];
      html += `<td class="cov-cell ${lvl==='P90'?'p90':''}" style="color:${covColor(cov)}">${cov != null ? cov.toFixed(1)+'%' : '--'}</td>`;
      if (showBg) html += `<td class="bg-col" style="color:${bgColor(bg)}">${bg != null ? bg : '?'}</td>`;
      if (showAlerts) html += `<td class="bg-col" style="color:${bgColor(alerts)}">${alerts != null ? alerts : '?'}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  document.getElementById('tableContainer').innerHTML = html;
}

function sortBy(col) {
  DATA.sort((a,b) => {
    let va = a[col], vb = b[col];
    if (va == null) va = -Infinity;
    if (vb == null) vb = -Infinity;
    if (typeof va === 'string') va = parseFloat(va);
    if (typeof vb === 'string') vb = parseFloat(vb);
    if (isNaN(va)) va = -Infinity;
    if (isNaN(vb)) vb = -Infinity;
    return vb - va;
  });
  render();
}
