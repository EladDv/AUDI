[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "audi"
version = "0.2.0"
description = "Acoustic UAV Detection and Identification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "audi Contributors" }]
dependencies = [
    "datasets>=4.8.4",
    "lightning>=2.6.1",
    "numpy>=2",
    "pyyaml>=6.0,<7.0",
    "scipy>=1.15",
    "soundfile>=0.13.0",
    "tensorboard>=2.20.0",
    "torch==2.10.0",
    "torchaudio==2.10.0",
    "torchvision==0.25.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
eval = [
    "streamlit>=1.57.0",
    "plotly>=6.7.0",
]
export = [
    "litert-torch>=0.9.0",
]

[dependency-groups]
dev = [
    "librosa>=0.11.0",
    "pytest>=8.0",
    "ruff>=0.15.10",
]

[project.scripts]
audi-train = "scripts.cli.train_detect:run"
audi-eval = "scripts.cli._dispatch:eval_main"
audi-data = "scripts.cli._dispatch:data_main"
audi-export-tflite = "scripts.cli.export.tflite:main"
audi-train-blue-red = "scripts.cli.train_blue_red:main"
audi-export-blue-red-tflite = "scripts.cli.export.blue_red_tflite:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audi", "scripts", "models"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: expensive optional tests that are skipped by default unless enabled",
]
