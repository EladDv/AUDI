[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[project]
name = "audi"
version = "0.2.0"
description = "Acoustic UAV Detection and Identification"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "audi Contributors" }]
dependencies = [
    "ai-edge-model-explorer>=0.1.32",
    "ai-edge-torch>=0.7.2",
    "datasets>=4.8.4",
    "fastervit>=1.0.0",
    "librosa>=0.11.0",
    "lightning>=2.6.1",
    "litert-torch>=0.9.0",
    "matplotlib>=3.10.8",
    "numpy>=2",
    "pandas>=2.3.3",
    "plotly>=6.7.0",
    "polars>=1.40.1",
    "ruff>=0.15.10",
    "scikit-learn>=1.8.0",
    "scipy>=1.15",
    "silero-vad>=6.2.1",
    "soundfile>=0.13.0",
    "ssqueezepy>=0.6.6",
    "streamlit>=1.57.0",
    "tensorboard>=2.20.0",
    "tensorflow>=2.21.0",
    "timm>=1.0.27",
    "torch==2.10.0",
    "torchao==0.16.0",
    "torchaudio==2.10.0",
    "torchcodec==0.10.0",
    "torchvision==0.25.0",
    "tqdm>=4.66.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.6",
]
eval = [
    "streamlit>=1.35.0",
    "plotly>=6.7.0",
]
datasets = [
    "huggingface-hub>=0.36.0",
    "librosa>=0.11.0",
]
app = [
    "flask>=3.0,<4.0",
    "pyyaml>=6.0,<7.0",
    "rpi-lgpio>=0.4,<1.0",
]

[project.scripts]
audi-train = "scripts.train:main"
audi-eval = "scripts.evaluate:main"
audi-data = "scripts.build_data:main"
audi-infer = "scripts.inference:main"
audi-ensemble = "scripts.eval_ensemble:main"
audi-export-tflite = "scripts.export_tflite:main"

[tool.hatch.build.targets.wheel]
packages = ["src/audi", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
