# Augmentation sweep — test new 0.25-prob defaults + doppler on convnext_small
name: aug_sweep
noise_path: data/HF_dataset_v2_background
drone_path: data/HF_dataset_v2_drone
description: >
  Test the new augmentation defaults (all probs at 0.25 including doppler)
  on convnext_small at 5.12s with merged noise2 dataset. Goal: reduce bg
  false alarms through richer training-time audio variation.
base_flags: >-
  --arch convnext_small --lr 1e-4 --clip-seconds 5.12 --epochs 30 --patience 0
  --noise2 data/hf_dataset_sharded_expanded_merged --batch-size 24
configs:
  # ── Baseline: no augment (reference) ──
  - name: "01_no_augment"
    flags: ""
    note: >
      Baseline — no augmentations at all. Reference point for aug impact.

  # ── New default augments (all 0.25 probs + doppler) ──
  - name: "02_augment"
    flags: --augment
    note: >
      All augmentations at 0.25 prob: pitch, stretch, reverb, eq,
      noise_inject, time_mask, lowpass, fade, atmospheric, doppler.

  # ── Augment + focal loss ──
  - name: "03_augment_focal"
    flags: --augment --loss focal
    note: >
      Augments + focal loss. Focal down-weights easy negatives —
      the augmented backgrounds should become harder, focusing
      the model on the boundary.

  # ── Augment + label smoothing ──
  - name: "04_augment_smooth"
    flags: --augment --label-smoothing 0.1
    note: >
      Augments + label smoothing. Smoothing prevents overconfidence
      on augmented examples that look ambiguous.

  # ── Augment + focal + smooth combo ──
  - name: "05_augment_focal_smooth"
    flags: --augment --loss focal --label-smoothing 0.1
    note: >
      Augments + focal + label smoothing. Full regularization stack.
      Hypothesis: augments make the data harder, focal focuses on the
      boundary, smoothing prevents overconfidence.
