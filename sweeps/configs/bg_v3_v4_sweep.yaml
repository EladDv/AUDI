name: bg_v3_v4_sweep
noise_path: data/HF_dataset_v3_background
drone_path: data/HF_dataset_v2_drone
description: >
  Best model configs tested against v3 and v4 background datasets.
  Compares BCE vs focal, wd variants, and PCEN on the larger/cleaner
  v3 (70 WAVs) and v4 (1237 WAVs) background sets.
base_flags: >-
  --patience 0 --epochs 25
  --noise2 data/hf_dataset_sharded_expanded_merged --batch-size 24
  --lr 1e-4 --lr-schedule linear --warmup-epochs 8
  --augment --clip-seconds 5.12
configs:
  # ── v3 background, BCE models ──
  - name: "01_v3_bce_wd003"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --arch convnext_small --loss bce --label-smoothing 0.1
      --weight-decay 0.03
    note: Best BCE config (wd=0.03) on v3 background.

  - name: "02_v3_bce_wd002"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --arch convnext_small --loss bce --label-smoothing 0.1
      --weight-decay 0.02
    note: Lower wd on v3 — may generalize better with cleaner bg.

  - name: "03_v3_bce_pcen"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --arch convnext_small --loss bce --label-smoothing 0.1
      --weight-decay 0.03 --use-pcen
    note: PCEN mel + best BCE config on v3.

  # ── v3 background, focal models ──
  - name: "04_v3_focal_wd003"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --arch convnext_small --loss focal
      --weight-decay 0.03
    note: Focal loss wd=0.03 on v3 background.

  - name: "05_v3_focal_pcen"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --arch convnext_small --loss focal
      --weight-decay 0.03 --use-pcen
    note: Focal + PCEN on v3 background.

  # ── v4 background, BCE models ──
  - name: "06_v4_bce_wd003"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --arch convnext_small --loss bce --label-smoothing 0.1
      --weight-decay 0.03
    note: Best BCE config on v4 (largest) background.

  - name: "07_v4_bce_wd002"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --arch convnext_small --loss bce --label-smoothing 0.1
      --weight-decay 0.02
    note: Lower wd BCE on v4 background.

  - name: "08_v4_bce_pcen"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --arch convnext_small --loss bce --label-smoothing 0.1
      --weight-decay 0.03 --use-pcen
    note: PCEN + best BCE on v4 background.

  # ── v4 background, focal models ──
  - name: "09_v4_focal_wd003"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --arch convnext_small --loss focal
      --weight-decay 0.03
    note: Focal loss on v4 background.

  - name: "10_v4_focal_pcen"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --arch convnext_small --loss focal
      --weight-decay 0.03 --use-pcen
    note: Focal + PCEN on v4 background.

  # ── DSP variants on v4 ──
  - name: "11_v4_dsp_all"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --arch convnext_small --loss bce --label-smoothing 0.1
      --weight-decay 0.03 --use-dsp-features --dsp-feature-sets v3,v4,v5
    note: BCE wd=0.03 + all DSP features on v4 background.

  - name: "12_v4_dsp_v3v5"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --arch convnext_small --loss bce --label-smoothing 0.1
      --weight-decay 0.03 --use-dsp-features --dsp-feature-sets v3,v5
    note: BCE + lightweight DSP (v3+v5) on v4 background.
