# Blue vs Red multi-task drone detector+classifier sweep
# AudioSet-pretrained MN backbones → dual head (detection + classification)
# Mixes blue/red drone audio into background noise at controlled SNRs.
name: blue_red_detect
bg_path: data/HF_dataset_v6_background
drone_path: data/hf_blue_red
description: >-
  Multi-task blue/red drone detector. MN backbones with dual head:
  detection (drone vs no-drone) + classification (blue vs red).
  Drone mixed into v6 background at SNRs [-20, 10] dB.
base_flags: --epochs 25 --batch-size 64 --snr-min -20 --snr-max 10 --positive-prob 0.5 --freeze-backbone-epochs 2
configs:
  # ═══════════════════════════════════════════
  # mn05_as (1.5M params) — lightweight
  # ═══════════════════════════════════════════
  - name: "01_mn05_lr1e4"
    flags: --model-arch mn05_as --lr 1e-4 --cls-loss-weight 0.5
    note: mn05_as baseline, cls_weight=0.5.

  - name: "02_mn05_lr3e4"
    flags: --model-arch mn05_as --lr 3e-4 --cls-loss-weight 0.5
    note: mn05_as higher LR.

  - name: "03_mn05_lr1e4_cls1"
    flags: --model-arch mn05_as --lr 1e-4 --cls-loss-weight 1.0
    note: mn05_as equal weight on cls vs det.

  # ═══════════════════════════════════════════
  # mn10_as (4.9M params) — larger
  # ═══════════════════════════════════════════
  - name: "04_mn10_lr1e4"
    flags: --model-arch mn10_as --lr 1e-4 --cls-loss-weight 0.5
    note: mn10_as baseline.

  - name: "05_mn10_lr3e4"
    flags: --model-arch mn10_as --lr 3e-4 --cls-loss-weight 0.5
    note: mn10_as higher LR.

  - name: "06_mn10_lr1e4_cls1"
    flags: --model-arch mn10_as --lr 1e-4 --cls-loss-weight 1.0
    note: mn10_as equal weight on cls vs det.
