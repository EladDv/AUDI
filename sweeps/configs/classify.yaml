# DADS classification pretraining sweep
# Trains a binary drone-vs-non-drone classifier (no background mixing)
name: classify
noise_path: data/HF_filtered_background
drone_path: data/HF_filtered_drone
description: DADS classification pretraining — LR and dropout sweep
base_flags: --arch resnet18 --lr 1e-4 --epochs 15 --patience 0
configs:
  - name: "01_resnet18_lr_0.0001_dropout_0.0"
    flags: --lr 1e-4 --dropout 0.0
  - name: "02_resnet18_lr_0.0001_dropout_0.2"
    flags: --lr 1e-4 --dropout 0.2
  - name: "03_resnet18_lr_0.0003_dropout_0.0"
    flags: --lr 3e-4 --dropout 0.0
  - name: "04_resnet18_lr_0.0003_dropout_0.2"
    flags: --lr 3e-4 --dropout 0.2
  - name: "05_resnet18_lr_0.001_dropout_0.0"
    flags: --lr 1e-3 --dropout 0.0
  - name: "06_resnet18_lr_0.001_dropout_0.2"
    flags: --lr 1e-3 --dropout 0.2
