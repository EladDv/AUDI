# DADS classification pretraining sweep — MN architectures
# Trains binary drone-vs-non-drone classifiers (no background mixing).
# Output checkpoints can be used as pretrained weights for detection fine-tuning.
name: classify_mn
mode: classify
noise_path: ""
drone_path: data/hf_pretrain_classify
description: >
  DADS classification pretraining on MN architectures.
  Covers mn04_as, mn05_as, mn10_as with LR and dropout variants.
  Use checkpoints as --pretrained-checkpoint for detection fine-tuning.
base_flags: --epochs 15 --batch-size 64 --clip-seconds 2.56
configs:

  # ═══════════════════════════════════════════
  # mn04_as (0.98M params)
  # ═══════════════════════════════════════════
  - name: "01_mn04_lr1e4"
    flags: --model-arch mn04_as --lr 1e-4
    note: mn04_as baseline.

  - name: "02_mn04_lr1e4_drop02"
    flags: --model-arch mn04_as --lr 1e-4 --dropout 0.2
    note: mn04_as + dropout 0.2.

  - name: "03_mn04_lr3e4"
    flags: --model-arch mn04_as --lr 3e-4
    note: mn04_as higher LR.

  - name: "04_mn04_lr3e4_drop02"
    flags: --model-arch mn04_as --lr 3e-4 --dropout 0.2
    note: mn04_as higher LR + dropout.

  # ═══════════════════════════════════════════
  # mn05_as (1.43M params)
  # ═══════════════════════════════════════════
  - name: "05_mn05_lr1e4"
    flags: --model-arch mn05_as --lr 1e-4
    note: mn05_as baseline.

  - name: "06_mn05_lr1e4_drop02"
    flags: --model-arch mn05_as --lr 1e-4 --dropout 0.2
    note: mn05_as + dropout 0.2.

  - name: "07_mn05_lr3e4"
    flags: --model-arch mn05_as --lr 3e-4
    note: mn05_as higher LR.

  - name: "08_mn05_lr3e4_drop02"
    flags: --model-arch mn05_as --lr 3e-4 --dropout 0.2
    note: mn05_as higher LR + dropout.

  # ═══════════════════════════════════════════
  # mn10_as (4.88M params)
  # ═══════════════════════════════════════════
  - name: "09_mn10_lr1e4"
    flags: --model-arch mn10_as --lr 1e-4
    note: mn10_as baseline.

  - name: "10_mn10_lr1e4_drop02"
    flags: --model-arch mn10_as --lr 1e-4 --dropout 0.2
    note: mn10_as + dropout 0.2.

  - name: "11_mn10_lr3e4"
    flags: --model-arch mn10_as --lr 3e-4
    note: mn10_as higher LR.

  - name: "12_mn10_lr3e4_drop02"
    flags: --model-arch mn10_as --lr 3e-4 --dropout 0.2
    note: mn10_as higher LR + dropout.
