# ConvNeXt regularization sweep — focal + smooth + mixup + dropout + wd
name: convnext_reg
noise_path: data/HF_dataset_v2_background
drone_path: data/HF_dataset_v2_drone
description: Build on convnext_bfr winner (focal_smooth: 44% cov / 72 bg at P90).
  Add MixUp, dropout, weight decay, longer cosine schedule. Test both
  convnext_small and convnext_base.
base_flags: >-
  --lr 1e-4 --clip-seconds 5.12 --epochs 40 --patience 0
  --noise2 data/hf_dataset_sharded_expanded_merged --batch-size 24
  --loss focal --label-smoothing 0.1 --augment
  --lr-schedule cosine --warmup-epochs 5
configs:
  # ── Small: focal + smooth + longer training (baseline) ──
  - name: "01_small_focal_smooth"
    flags: --arch convnext_small
    note: >
      The winning combo from convnext_bfr but at 40 epochs with
      patience disabled. Baseline for regularization additions.

  # ── Small: + MixUp ──
  - name: "02_small_mixup"
    flags: --arch convnext_small --mixup-alpha 0.2
    note: >
      Focal + smooth + MixUp (α=0.2). MixUp interpolates training
      examples, helping the model learn smoother decision boundaries
      between drone and background.

  # ── Small: + dropout ──
  - name: "03_small_dropout"
    flags: --arch convnext_small --dropout 0.2
    note: >
      Focal + smooth + dropout 0.2 on classifier head. Prevents
      overfitting to specific background patterns that cause false
      alarms.

  # ── Small: + weight decay ──
  - name: "04_small_wd"
    flags: --arch convnext_small --weight-decay 0.05
    note: >
      Focal + smooth + stronger weight decay (0.05 vs default 0.01).
      Regularizes the backbone to reduce overfitting on merged noise2.

  # ── Small: full stack ──
  - name: "05_small_full"
    flags: --arch convnext_small --mixup-alpha 0.2 --dropout 0.2 --weight-decay 0.05
    note: >
      Focal + smooth + MixUp + dropout + stronger weight decay.
      Full regularization stack. Risk: over-regularization.

  # ── Base: focal + smooth (reference) ──
  - name: "06_base_focal_smooth"
    flags: --arch convnext_base
    note: >
      ConvNeXt Base with focal + smooth + augment. Base had 0.789
      val AUC (best ever) but collapsed on attack eval without augment.
      Augments should fix the generalization gap.

  # ── Base: + MixUp ──
  - name: "07_base_mixup"
    flags: --arch convnext_base --mixup-alpha 0.2
    note: >
      Base + focal + smooth + MixUp. The big model with the best
      regularization — highest potential if it doesn't overfit.
