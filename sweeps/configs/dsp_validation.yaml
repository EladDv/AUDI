name: dsp_validation
noise_path: data/HF_dataset_v3_background
drone_path: data/HF_dataset_v2_drone
description: >
  Validation sweep — re-run critical DSP configs with different seeds
  to measure run-to-run variance. Original dsp_sweep showed 17-point
  gap on identical config (07_all 50% vs 01_v3 33%). Need stable means.
base_flags: >-
  --arch convnext_small --clip-seconds 5.12 --patience 0 --epochs 25
  --noise2 data/hf_dataset_sharded_expanded_merged --batch-size 24
  --loss bce --label-smoothing 0.1 --augment --lr 1e-4
  --lr-schedule linear --warmup-epochs 8 --weight-decay 0.03
configs:
  # ════════════════════════════════════════════════════════════════
  # 07_all — 3 seeds to measure baseline variance
  # ════════════════════════════════════════════════════════════════
  - name: "01_07all_seed42"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --dsp-feature-sets v3,v4,v5
      --seed 42
    note: Original 07_all config, seed 42 — matches original + new baseline.

  - name: "02_07all_seed123"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --dsp-feature-sets v3,v4,v5
      --seed 123
    note: Same config, different seed.

  - name: "03_07all_seed999"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --dsp-feature-sets v3,v4,v5
      --seed 999
    note: Same config, third seed.

  # ════════════════════════════════════════════════════════════════
  # 14_v4_hop320 — 3 seeds, best config from v3v4 sweep
  # ════════════════════════════════════════════════════════════════
  - name: "04_v4hop320_seed42"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --dsp-feature-sets v3,v4,v5 --dsp-hop-length 320
      --seed 42
    note: v4 background + coarse hop — best from v3v4 sweep (60.6% P50).

  - name: "05_v4hop320_seed123"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --dsp-feature-sets v3,v4,v5 --dsp-hop-length 320
      --seed 123
    note: v4+hop320, seed 123.

  - name: "06_v4hop320_seed999"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --dsp-feature-sets v3,v4,v5 --dsp-hop-length 320
      --seed 999
    note: v4+hop320, seed 999.

  # ════════════════════════════════════════════════════════════════
  # 12_proj128 — 2 seeds to confirm projector benefit
  # ════════════════════════════════════════════════════════════════
  - name: "07_proj128_seed42"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --dsp-feature-sets v3,v4,v5 --dsp-projector-hidden 128
      --seed 42
    note: 12_proj128 on v3 bg, seed 42 — matches original + new 03_v3_proj128.

  - name: "08_proj128_seed123"
    flags: >-
      --noise-path data/HF_dataset_v3_background
      --dsp-feature-sets v3,v4,v5 --dsp-projector-hidden 128
      --seed 123
    note: 12_proj128 on v3, seed 123.

  # ════════════════════════════════════════════════════════════════
  # v4 + proj128 combo
  # ════════════════════════════════════════════════════════════════
  - name: "09_v4_proj128_seed42"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --dsp-feature-sets v3,v4,v5 --dsp-projector-hidden 128
      --seed 42
    note: proj128 on v4 bg — test if v4+projector combo works.

  - name: "10_v4_proj128_seed123"
    flags: >-
      --noise-path data/HF_dataset_v4_background
      --dsp-feature-sets v3,v4,v5 --dsp-projector-hidden 128
      --seed 123
    note: v4+proj128, seed 123.
