name: dymn10_distill_under4m_mn
noise_path: data/HF_dataset_v7_background
drone_path: data/HF_dataset_v2_drone
description: >-
  Distil the current field-tuned dymn10_as teacher into MobileNet-family
  students under 4M params, starting at width 0.4. Covers paired static/dynamic
  students where the dynamic variant fits under 4M, includes invented scratch
  widths, and adds scratch controls for every pretrained student.
base_flags: >-
  --clip-seconds 5.12 --patience 0 --epochs 18 --batch-size 24
  --steps-per-epoch 250 --val-steps-per-epoch 120
  --loss bce --label-smoothing 0.03 --augment
  --lr 3.0e-5 --lr-schedule linear --warmup-epochs 1
  --weight-decay 0.03 --freeze-backbone-epochs 2
  --positive-probability 0.62
  --hard-noise data/field_recordings_20260514/mined_hard_negatives/hf_dataset
  --hard-noise-prob 0.07
  --noise2 data/HF_dataset_v7_background --noise2-prob 0.45
  --noise2-multi-prob 0.40 --noise2-count 3 --noise2-max-attenuation -38
  --doppler-prob 0.35 --pitch-prob 0.25 --stretch-prob 0.25
  --reverb-prob 0.25 --eq-prob 0.35 --noise-inject-prob 0.25
  --noise-inject-db -40 --time-mask-prob 0.20 --lowpass-prob 0.20
  --atmospheric-prob 0.25
  --distill-from checkpoints/field_hard_negative_finetune_v4_sizes_20260530_130027/05_dymn10_v4_hard07_freeze3_lr10e6/checkpoints/epoch=11-step=3000.ckpt
  --distill-arch dymn10_as --distill-alpha 0.65 --distill-temperature 2.0
configs:
  - name: 01_mn04_as_distill_pretrained
    flags: --arch mn04_as
    note: Static MN width 0.4, AudioSet pretrained, under 4M after dropping unused AS head.
  - name: 02_dymn04_as_distill_pretrained
    flags: --arch dymn04_as
    note: Dynamic MN width 0.4, AudioSet pretrained.
  - name: 03_mn05_as_distill_pretrained
    flags: --arch mn05_as
    note: Static MN width 0.5, AudioSet pretrained.
  - name: 04_mn10_as_distill_pretrained
    flags: --arch mn10_as
    note: Static MN width 1.0, AudioSet pretrained; fits under 4M after dropping unused AS head.

  - name: 05_mn04_distill_scratch
    flags: --arch mn04_as --no-pretrained --lr 6.0e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Static MN width 0.4, scratch control for pretrained student.
  - name: 06_dymn04_distill_scratch
    flags: --arch dymn04_as --no-pretrained --lr 4.0e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Dynamic MN width 0.4, scratch control for pretrained student.
  - name: 07_mn05_distill_scratch
    flags: --arch mn05_as --no-pretrained --lr 6.0e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Static MN width 0.5, scratch control for pretrained student.
  - name: 08_mn10_distill_scratch
    flags: --arch mn10_as --no-pretrained --lr 4.0e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Static MN width 1.0, scratch control for pretrained student.

  - name: 09_dymn05_distill_scratch
    flags: --arch dymn05 --no-pretrained --lr 4.0e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Invented dynamic MN width 0.5, scratch-only.
  - name: 10_mn06_distill_scratch
    flags: --arch mn06 --no-pretrained --lr 5.0e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Invented static MN width 0.6, scratch-only.
  - name: 11_dymn06_distill_scratch
    flags: --arch dymn06 --no-pretrained --lr 3.5e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Invented dynamic MN width 0.6, scratch-only.
  - name: 12_mn08_distill_scratch
    flags: --arch mn08 --no-pretrained --lr 4.0e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Invented static MN width 0.8, scratch-only.
  - name: 13_dymn08rt_distill_scratch
    flags: --arch dymn08_rt --no-pretrained --lr 3.0e-4 --warmup-epochs 2 --weight-decay 0.05 --freeze-backbone-epochs 0
    note: Invented dynamic MN width 0.8 with reduced tail to keep under 4M, scratch-only.
