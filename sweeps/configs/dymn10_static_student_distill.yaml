name: dymn10_static_student_distill
noise_path: data/HF_dataset_v7_background
drone_path: data/HF_dataset_v2_drone
description: >
  Train Hailo-friendly static EfficientAT MobileNet students from the best
  available dymn10 teacher. The teacher checkpoint is loaded as a full detector,
  so its own frontend contract is preserved while students can use either the
  default 64 ms window or a 25 ms window.

base_flags: >-
  --clip-seconds 5.12 --patience 0
  --noise2 data/hf_dataset_sharded_expanded_merged --noise2-prob 0.5
  --noise2-multi-prob 0.5 --noise2-count 5 --noise2-max-attenuation -30
  --batch-size 24 --loss bce --label-smoothing 0.1 --augment --lr 1e-4
  --lr-schedule linear --warmup-epochs 8 --weight-decay 0.03 --epochs 25
  --distill-from checkpoints/mel_preprocessing_sweep_20260610_005658/02_dymn10_as/checkpoints/epoch=22-step=5750.ckpt
  --distill-alpha 0.70 --distill-temperature 2.0

configs:
  - name: "01_mn05_from_dymn10"
    flags: --arch mn05_as
    note: Slightly larger static student, still deployment-friendly.

  - name: "02_mn10_from_dymn10"
    flags: --arch mn10_as
    note: Main static student candidate for Hailo; good latency/capacity tradeoff.

  - name: "03_mn20_from_dymn10"
    flags: --arch mn20_as
    note: High-capacity static student; best chance to preserve dymn10 behavior.

  - name: "05_mn05_25ms_from_dymn10"
    flags: --arch mn05_as --win-length 400
    note: Mid-small static student with 25 ms analysis window.

  - name: "06_mn10_25ms_from_dymn10"
    flags: --arch mn10_as --win-length 400
    note: Main Hailo candidate with 25 ms analysis window.

  - name: "07_mn20_25ms_from_dymn10"
    flags: --arch mn20_as --win-length 400
    note: High-capacity static 25 ms student.

  - name: "08_mn10_teacher_heavy_from_dymn10"
    flags: --arch mn10_as --distill-alpha 0.90 --distill-temperature 3.0
    note: Tests whether stronger teacher matching improves the main static candidate.

  - name: "09_mn20_teacher_heavy_from_dymn10"
    flags: --arch mn20_as --distill-alpha 0.90 --distill-temperature 3.0
    note: Tests teacher-heavy distillation on the high-capacity static candidate.

  - name: "10_sdymn10_from_dymn10"
    flags: --arch sdymn10 --no-pretrained
    note: Static DyMN-derived topology with DyMN10 width; no dynamic conv/ReLU/CA.

  - name: "14_sdymn10_25ms_from_dymn10"
    flags: --arch sdymn10 --no-pretrained --win-length 400
    note: Static DyMN10-derived topology with 25 ms analysis window.

  - name: "10_sdymn20_from_dymn10"
    flags: --arch sdymn20 --no-pretrained
    note: Static DyMN-derived topology with DyMN20 width; no dynamic conv/ReLU/CA.

  - name: "14_sdymn20_25ms_from_dymn10"
    flags: --arch sdymn20 --no-pretrained --win-length 400
    note: Static DyMN20-derived topology with 25 ms analysis window.

  - name: "18_sdymn30_from_dymn10"
    flags: --arch sdymn30 --no-pretrained
    note: Larger static DyMN-derived topology; about 12M params without dynamic ops.

  - name: "19_sdymn40_from_dymn10"
    flags: --arch sdymn40 --no-pretrained
    note: Large static DyMN-derived topology; about 22M params without dynamic ops.

  - name: "22_sdymn30_25ms_from_dymn10"
    flags: --arch sdymn30 --no-pretrained --win-length 400
    note: Larger static DyMN-derived topology with 25 ms analysis window.

  - name: "23_sdymn40_25ms_from_dymn10"
    flags: --arch sdymn40 --no-pretrained --win-length 400
    note: Large static DyMN-derived topology with 25 ms analysis window.