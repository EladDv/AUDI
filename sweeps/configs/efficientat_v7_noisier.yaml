name: efficientat
noise_path: data/HF_dataset_v7_background
drone_path: data/HF_dataset_v2_drone
description: Best + EfficientAT pre-trained models (AudioSet → drone detection fine-tuning)
base_flags: >-
  --clip-seconds 5.12 --patience 0 --epochs 25
  --noise2 data/hf_dataset_sharded_expanded_merged --noise2-prob 0.5 --noise2-multi-prob 0.5 --noise2-count 5 --noise2-max-attenuation -30 --batch-size 24
  --loss bce --label-smoothing 0.1 --augment --lr 1e-4
  --lr-schedule linear
configs:
  - name: "14_dymn04_as"
    flags: --arch dymn04_as
    note: DyMN width=0.4, 0.98M params, AudioSet mAP 43.2
  - name: "15_dymn10_as"
    flags: --arch dymn10_as
    note: DyMN width=1.0, 4.88M params, AudioSet mAP 47.1

  - name: "16_mn04_as"
    flags: --arch mn04_as
    note: MN width=0.4, 0.98M params, AudioSet mAP 43.2
  - name: "17_mn05_as"
    flags: --arch mn05_as
    note: MN width=0.5, 1.43M params, AudioSet mAP 44.3
  - name: "18_mn10_as"
    flags: --arch mn10_as
    note: MN width=1.0, 4.88M params, AudioSet mAP 47.1
