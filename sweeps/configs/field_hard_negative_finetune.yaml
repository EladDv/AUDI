name: field_hard_negative_finetune
noise_path: data/field_recordings_20260514/mined_hard_negatives/hf_dataset
drone_path: data/HF_dataset_v2_drone
description: >-
  Fine-tune from the best low-FP field model using mined false-positive
  windows from raw field recordings as hard-negative backgrounds. Positives
  are HF_dataset_v2_drone stems mixed into those field noises, not clean
  standalone drone clips. This intentionally does not use 551 data.
base_flags: >-
  --clip-seconds 5.12 --patience 0 --epochs 12
  --batch-size 24 --steps-per-epoch 250 --val-steps-per-epoch 120
  --loss bce --label-smoothing 0.05 --augment
  --lr 3e-5 --lr-schedule linear --warmup-epochs 2 --weight-decay 0.03
  --positive-probability 0.5
  --noise2 data/HF_dataset_v7_background --noise2-prob 0.35
  --noise2-multi-prob 0.35 --noise2-count 3 --noise2-max-attenuation -35
configs:
  - name: "01_mn10_hard_fp"
    flags: >-
      --arch mn10_as
      --finetune-from checkpoints/efficientat_20260528_232959/16_mn10_as/checkpoints/epoch=22-step=5750.ckpt
    note: Best current low-FP model, adapted to mined field false positives.

  - name: "02_dymn10_hard_fp"
    flags: >-
      --arch dymn10_as
      --finetune-from checkpoints/efficientat_20260528_232959/12_dymn10_as/checkpoints/epoch=14-step=3750.ckpt
    note: Higher attack coverage low-FP candidate, adapted to mined field false positives.
