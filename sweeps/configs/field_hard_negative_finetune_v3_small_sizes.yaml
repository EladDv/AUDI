name: field_hard_negative_finetune_v3_small_sizes
noise_path: data/HF_dataset_v7_background
drone_path: data/HF_dataset_v2_drone
description: >-
  Current coverage-recovery hard-negative finetune settings for the smaller
  EfficientAT MN sizes and supported small dynamic MN model. This reuses the
  completed current-setting EfficientAT pretraining checkpoints and does not use
  551 data.
base_flags: >-
  --clip-seconds 5.12 --patience 0 --epochs 14
  --batch-size 24 --steps-per-epoch 250 --val-steps-per-epoch 120
  --loss bce --label-smoothing 0.05 --augment
  --lr 1.2e-5 --lr-schedule linear --warmup-epochs 1 --weight-decay 0.03
  --freeze-backbone-epochs 4 --positive-probability 0.60
  --hard-noise data/field_recordings_20260514/mined_hard_negatives/hf_dataset
  --hard-noise-prob 0.10
  --noise2 data/HF_dataset_v7_background --noise2-prob 0.55
  --noise2-multi-prob 0.45 --noise2-count 3 --noise2-max-attenuation -35
  --doppler-prob 0.30 --pitch-prob 0.30 --stretch-prob 0.30
  --reverb-prob 0.30 --eq-prob 0.40 --noise-inject-prob 0.30
  --noise-inject-db -38 --time-mask-prob 0.25 --lowpass-prob 0.25
  --atmospheric-prob 0.30
configs:
  - name: "01_mn04_cov_hard10_freeze4_lr12e6"
    flags: >-
      --arch mn04_as
      --finetune-from checkpoints/efficientat_20260528_232959/14_mn04_as/checkpoints/epoch=24-step=6250.ckpt
    note: Current v3 coverage finetune for MN width 0.4.

  - name: "02_mn05_cov_hard10_freeze4_lr12e6"
    flags: >-
      --arch mn05_as
      --finetune-from checkpoints/efficientat_20260528_232959/15_mn05_as/checkpoints/epoch=23-step=6000.ckpt
    note: Current v3 coverage finetune for MN width 0.5.

  - name: "03_dymn04_cov_hard10_freeze4_lr12e6"
    flags: >-
      --arch dymn04_as
      --finetune-from checkpoints/efficientat_20260528_232959/11_dymn04_as/checkpoints/epoch=23-step=6000.ckpt
    note: Supported small dynamic MN; there is no local dymn05_as checkpoint/model.
