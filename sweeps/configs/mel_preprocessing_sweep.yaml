name: mel_preprocessing_sweep
noise_path: data/HF_dataset_v7_background
drone_path: data/HF_dataset_v2_drone
description: >
  Compare mel preprocessing strategies, including wider MN variants and
  hard-negative variants that used to live in separate follow-up files.

base_flags: >-
  --clip-seconds 5.12 --patience 0
  --noise2 data/hf_dataset_sharded_expanded_merged --noise2-prob 0.5
  --noise2-multi-prob 0.5 --noise2-count 5 --noise2-max-attenuation -30
  --batch-size 24 --loss bce --label-smoothing 0.1 --augment --lr 1e-4
  --lr-schedule linear --warmup-epochs 8 --weight-decay 0.03 --epochs 25
configs:
  # DyMN/MN core variants.
  - name: "00_dymn10_as"
    flags: --arch dymn10_as
    note: DyMN width=1.0, 10M params, AudioSet mAP 48.4

  - name: "01_dymn04_as"
    flags: --arch dymn04_as
    note: DyMN width=0.4, 4M params, AudioSet mAP 46.2

  - name: "02_dymn20_as"
    flags: --arch dymn20_as
    note: DyMN width=2.0, 40M params, AudioSet mAP 49.4

  - name: "03_dymn10_as_25ms_win"
    flags: --arch dymn10_as --win-length 400
    note: DyMN width=1.0, 10M params, AudioSet mAP 48.4

  - name: "04_dymn04_as_25ms_win"
    flags: --arch dymn04_as --win-length 400
    note: DyMN width=0.4, 4M params, AudioSet mAP 46.2

  - name: "05_dymn20_as_25ms_win"
    flags: --arch dymn20_as --win-length 400
    note: DyMN width=2.0, 40M params, AudioSet mAP 49.4

  - name: "06_mn10_as"
    flags: --arch mn10_as
    note: MN width=1.0, 4.9M params, AudioSet mAP 47.9

  - name: "07_mn10_as_25ms_win"
    flags: --arch mn10_as --win-length 400
    note: MN width=1.0, 4.9M params, AudioSet mAP 47.9

  # Wider MN variants from the former extension file.
  - name: "08_mn05_as_25ms_win"
    flags: --arch mn05_as --win-length 400
    note: MN width=0.5 with 25 ms analysis window.

  - name: "09_mn20_as_25ms_win"
    flags: --arch mn20_as --win-length 400
    note: MN width=2.0 with 25 ms analysis window.

  - name: "10_mn30_as_25ms_win"
    flags: --arch mn30_as --win-length 400
    note: MN width=3.0 with 25 ms analysis window.

  - name: "11_mn40_as_25ms_win"
    flags: --arch mn40_as --win-length 400
    note: MN width=4.0 with 25 ms analysis window.

  - name: "12_mn20_as"
    flags: --arch mn20_as
    note: MN width=2.0 baseline window.

  - name: "13_mn30_as"
    flags: --arch mn30_as
    note: MN width=3.0 baseline window.

  - name: "14_mn40_as"
    flags: --arch mn40_as
    note: MN width=4.0 baseline window.

  # Hard-negative variants from the former hardnoise file.
  - name: "15_hard_dymn04_as"
    flags: >-
      --arch dymn04_as
      --hard-noise data/field_recordings_20260514/mined_hard_negatives/hf_dataset
      --hard-noise-prob 0.1
    note: DyMN width=0.4 with mined field hard negatives.

  - name: "16_hard_dymn10_as"
    flags: >-
      --arch dymn10_as
      --hard-noise data/field_recordings_20260514/mined_hard_negatives/hf_dataset
      --hard-noise-prob 0.1
    note: DyMN width=1.0 with mined field hard negatives.

  - name: "17_hard_dymn10_as_25ms_win"
    flags: >-
      --arch dymn10_as --win-length 400
      --hard-noise data/field_recordings_20260514/mined_hard_negatives/hf_dataset
      --hard-noise-prob 0.1
    note: DyMN width=1.0, 25 ms window, with mined field hard negatives.

  - name: "18_hard_dymn04_as_25ms_win"
    flags: >-
      --arch dymn04_as --win-length 400
      --hard-noise data/field_recordings_20260514/mined_hard_negatives/hf_dataset
      --hard-noise-prob 0.1
    note: DyMN width=0.4, 25 ms window, with mined field hard negatives.
