name: mn_sweep_v6
noise_path: data/HF_dataset_v6_background
drone_path: data/HF_dataset_v2_drone
description: >
  Big sweep on MN architectures (mn04_as, mn05_as, mn10_as) with v6 background.
  Varies augs, loss, mel params, PCEN, label smoothing, weight decay,
  and DSP branch fusion. Tests whether DSP features as a separate branch
  improve MN predictions over standard mel-only input.
base_flags: >-
  --clip-seconds 5.12 --patience 0 --epochs 25
  --noise2 data/hf_dataset_sharded_expanded_merged --batch-size 24
  --lr 1e-4 --lr-schedule linear --warmup-epochs 8
configs:

  # ═══════════════════════════════════════════════════════════════
  # ── mn04_as (width=0.4, 0.98M params) ──
  # ═══════════════════════════════════════════════════════════════

  # Baseline — vanilla BCE, no augs
  - name: "01_mn04_baseline"
    flags: --arch mn04_as --loss bce
    note: mn04_as baseline, no augs, no label smoothing.

  # Augment
  - name: "02_mn04_aug"
    flags: --arch mn04_as --loss bce --augment
    note: mn04_as + full augment stack.

  # Augment + smooth
  - name: "03_mn04_aug_smooth"
    flags: --arch mn04_as --loss bce --augment --label-smoothing 0.1
    note: mn04_as + aug + label smoothing 0.1.

  # Augment + smooth + wd=0.03
  - name: "04_mn04_aug_smooth_wd003"
    flags: --arch mn04_as --loss bce --augment --label-smoothing 0.1 --weight-decay 0.03
    note: mn04_as + aug + smooth + higher wd.

  # Focal + aug
  - name: "05_mn04_focal_aug"
    flags: --arch mn04_as --loss focal --augment
    note: mn04_as + focal loss + aug.

  # Focal + aug + smooth
  - name: "06_mn04_focal_aug_smooth"
    flags: --arch mn04_as --loss focal --augment --label-smoothing 0.1
    note: mn04_as + focal + aug + label smoothing.

  # PCEN variant
  - name: "07_mn04_pcen_aug"
    flags: --arch mn04_as --loss bce --augment --use-pcen --label-smoothing 0.1
    note: mn04_as + PCEN mel + aug + smooth.

  # DSP branch fusion (new MNDSPBranchDetector)
  - name: "08_mn04_dsp_branch_aug"
    flags: --arch mn04_as --loss bce --augment --label-smoothing 0.1 --use-dsp-branch --dsp-feature-sets v3,v4,v5
    note: mn04_as + two-branch DSP fusion + aug + smooth.

  # ═══════════════════════════════════════════════════════════════
  # ── mn05_as (width=0.5, 1.43M params) ──
  # ═══════════════════════════════════════════════════════════════

  - name: "09_mn05_baseline"
    flags: --arch mn05_as --loss bce
    note: mn05_as baseline, no augs.

  - name: "10_mn05_aug"
    flags: --arch mn05_as --loss bce --augment
    note: mn05_as + full augment stack.

  - name: "11_mn05_aug_smooth"
    flags: --arch mn05_as --loss bce --augment --label-smoothing 0.1
    note: mn05_as + aug + label smoothing 0.1.

  - name: "12_mn05_aug_smooth_wd003"
    flags: --arch mn05_as --loss bce --augment --label-smoothing 0.1 --weight-decay 0.03
    note: mn05_as + aug + smooth + higher wd.

  - name: "13_mn05_focal_aug"
    flags: --arch mn05_as --loss focal --augment
    note: mn05_as + focal loss + aug.

  - name: "14_mn05_focal_aug_smooth"
    flags: --arch mn05_as --loss focal --augment --label-smoothing 0.1
    note: mn05_as + focal + aug + label smoothing.

  - name: "15_mn05_pcen_aug"
    flags: --arch mn05_as --loss bce --augment --use-pcen --label-smoothing 0.1
    note: mn05_as + PCEN mel + aug + smooth.

  - name: "16_mn05_dsp_branch_aug"
    flags: --arch mn05_as --loss bce --augment --label-smoothing 0.1 --use-dsp-branch --dsp-feature-sets v3,v4,v5
    note: mn05_as + two-branch DSP fusion + aug + smooth.

  # ═══════════════════════════════════════════════════════════════
  # ── mn10_as (width=1.0, 4.88M params) ──
  # ═══════════════════════════════════════════════════════════════

  - name: "17_mn10_baseline"
    flags: --arch mn10_as --loss bce
    note: mn10_as baseline, no augs.

  - name: "18_mn10_aug"
    flags: --arch mn10_as --loss bce --augment
    note: mn10_as + full augment stack.

  - name: "19_mn10_aug_smooth"
    flags: --arch mn10_as --loss bce --augment --label-smoothing 0.1
    note: mn10_as + aug + label smoothing 0.1.

  - name: "20_mn10_aug_smooth_wd003"
    flags: --arch mn10_as --loss bce --augment --label-smoothing 0.1 --weight-decay 0.03
    note: mn10_as + aug + smooth + higher wd.

  - name: "21_mn10_focal_aug"
    flags: --arch mn10_as --loss focal --augment
    note: mn10_as + focal loss + aug.

  - name: "22_mn10_focal_aug_smooth"
    flags: --arch mn10_as --loss focal --augment --label-smoothing 0.1
    note: mn10_as + focal + aug + label smoothing.

  - name: "23_mn10_pcen_aug"
    flags: --arch mn10_as --loss bce --augment --use-pcen --label-smoothing 0.1
    note: mn10_as + PCEN mel + aug + smooth.

  - name: "24_mn10_dsp_branch_aug"
    flags: --arch mn10_as --loss bce --augment --label-smoothing 0.1 --use-dsp-branch --dsp-feature-sets v3,v4,v5
    note: mn10_as + two-branch DSP fusion + aug + smooth.

  # ═══════════════════════════════════════════════════════════════
  # ── DSP branch config variations (mn10_as only, best config) ──
  # ═══════════════════════════════════════════════════════════════

  - name: "25_mn10_dsp_branch_v3v5"
    flags: --arch mn10_as --loss bce --augment --label-smoothing 0.1 --use-dsp-branch --dsp-feature-sets v3,v5
    note: mn10_as + DSP branch with lightweight v3+v5 only (no v4 lattice).

  - name: "26_mn10_dsp_branch_v3v4v5"
    flags: --arch mn10_as --loss bce --augment --label-smoothing 0.1 --use-dsp-branch --dsp-feature-sets v3,v4,v5
    note: mn10_as + DSP branch with lightweight v3+v4+v5 only (no v4 lattice).

  - name: "27_mn10_dsp_branch_focal"
    flags: --arch mn10_as --loss focal --augment --label-smoothing 0.1 --use-dsp-branch --dsp-feature-sets v3,v4,v5
    note: mn10_as + DSP branch + focal loss.

  - name: "28_mn10_dsp_branch_pcen"
    flags: --arch mn10_as --loss bce --augment --use-pcen --label-smoothing 0.1 --use-dsp-branch --dsp-feature-sets v3,v4,v5
    note: mn10_as + DSP branch + PCEN mel frontend.

  # ── Channel-injected DSP baseline (for comparison with branch) ──
  - name: "29_mn10_dsp_channel_aug"
    flags: --arch mn10_as --loss bce --augment --label-smoothing 0.1 --use-dsp-features --dsp-feature-sets v3,v4,v5
    note: mn10_as + channel-injected DSP (not branch — baseline for comparison).
