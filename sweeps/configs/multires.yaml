# Clip length sweep — tests 1.28s, 2.56s, 5.12s
name: multires
noise_path: data/HF_filtered_background
drone_path: data/HF_filtered_drone
description: Tests different audio clip lengths
base_flags: --arch resnet18 --lr 1e-4 --mixup-alpha 0.2 --epochs 15 --patience 0
configs:
  - name: "01_resnet18_1.28s"
    flags: --clip-seconds 1.28
  - name: "02_resnet18_2.56s"
    flags: --clip-seconds 2.56
  - name: "03_resnet18_5.12s"
    flags: --clip-seconds 5.12
